name: Update Tutorials JSON

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  update-tutorials:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Debug repository files
        shell: bash
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f | sort

      - name: Generate tutorials JSON
        run: node build/generate-tutorials-json.js

      - name: Commit updated tutorials JSON
        shell: bash
        run: |
          if git diff --quiet -- website/tutorials.json; then
            echo "No tutorial changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/tutorials.json
          git commit -m "chore: refresh tutorials feed"
          git push
