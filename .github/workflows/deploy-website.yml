name: Deploy Website To FTP

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
      - '.github/workflows/update-tutorials.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: evd-website-production
  cancel-in-progress: false

jobs:
  deploy-website:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate website release files
        shell: bash
        run: |
          node -e "for (const file of ['website/update.json', 'website/releases.json']) JSON.parse(require('fs').readFileSync(file, 'utf8'));"
          test -f website/index.html
          for language in tr en de es fr; do
            test -f "website/$language/index.html"
            test -f "website/$language/guides.html"
          done
          if find website -type f -path 'website/downloads/*' -print -quit | grep -q .; then
            echo 'Large release packages must be uploaded manually; website/downloads must stay empty.' >&2
            exit 1
          fi

      - name: Configure restricted SSH deployment
        shell: bash
        env:
          EVD_WEB_SSH_PRIVATE_KEY: ${{ secrets.EVD_WEB_SSH_PRIVATE_KEY }}
          EVD_WEB_SSH_KNOWN_HOSTS: ${{ secrets.EVD_WEB_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EVD_WEB_SSH_PRIVATE_KEY" > "$HOME/.ssh/evd_web_deploy"
          chmod 600 "$HOME/.ssh/evd_web_deploy"
          printf '%s\n' "$EVD_WEB_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy website files
        shell: bash
        env:
          EVD_WEB_SSH_HOST: ${{ secrets.EVD_WEB_SSH_HOST }}
          EVD_WEB_SSH_PORT: ${{ secrets.EVD_WEB_SSH_PORT }}
          EVD_WEB_SSH_USER: ${{ secrets.EVD_WEB_SSH_USER }}
        run: |
          rsync -az --itemize-changes \
            --exclude '/downloads/***' \
            --exclude '/release-publishing-notes.md' \
            -e "ssh -i $HOME/.ssh/evd_web_deploy -p $EVD_WEB_SSH_PORT -o IdentitiesOnly=yes" \
            website/ "$EVD_WEB_SSH_USER@$EVD_WEB_SSH_HOST:./"
