name: Mac ARM64 Only Build (Experiment)

on:
  workflow_dispatch:

jobs:
  build-mac-arm:
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # This uses the original package.json and package-lock.json first
        run: npm ci

      - name: Generate bundled YouTube OAuth client
        env:
          EVD_YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.EVD_YOUTUBE_OAUTH_CLIENT_ID }}
          EVD_YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.EVD_YOUTUBE_OAUTH_CLIENT_SECRET }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const clientId = process.env.EVD_YOUTUBE_OAUTH_CLIENT_ID || '';
          const clientSecret = process.env.EVD_YOUTUBE_OAUTH_CLIENT_SECRET || '';
          fs.writeFileSync(
            'src/main/youtube-oauth-bundled.generated.js',
            `module.exports = ${JSON.stringify({ clientId, clientSecret }, null, 2)};\n`,
            'utf8'
          );
          NODE

      - name: Prepare Mac-safe package metadata
        run: |
          node build/prepare-mac-build-config.js
          echo "=== Mac package metadata ==="
          node -e "const p=require('./package.json'); console.log({version:p.version, productName:p.build.productName, executableName:p.build.executableName, mac:p.build.mac});"

      - name: Build Mac DMG (ARM64 Only)
        run: |
          echo "Starting Mac ARM64 DMG build..."
          npm run build:mac:dmg 2>&1 | tee build_output.log
          
      - name: List Output
        run: |
          ls -R dist/

      - name: Upload Mac ARM64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: evd-mac-arm64-dmg-v4.7.0
          path: dist/*.dmg
          retention-days: 5
