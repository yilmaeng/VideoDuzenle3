name: Mac ARM64 Only Build (Experiment)

on:
  workflow_dispatch:
  push:
    tags:
      - 'mac-v*'

jobs:
  build-mac-arm:
    runs-on: macos-14
    env:
      MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      MAC_KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
      MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate bundled YouTube OAuth client
        env:
          EVD_YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.EVD_YOUTUBE_OAUTH_CLIENT_ID }}
          EVD_YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.EVD_YOUTUBE_OAUTH_CLIENT_SECRET }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const clientId = process.env.EVD_YOUTUBE_OAUTH_CLIENT_ID || '';
          const clientSecret = process.env.EVD_YOUTUBE_OAUTH_CLIENT_SECRET || '';
          fs.writeFileSync(
            'src/main/youtube-oauth-bundled.generated.js',
            `module.exports = ${JSON.stringify({ clientId, clientSecret }, null, 2)};\n`,
            'utf8'
          );
          NODE

      - name: Configure signing mode
        run: |
          if [ -n "$MAC_CERTIFICATE_P12_BASE64" ] && [ -n "$MAC_CERTIFICATE_PASSWORD" ] && [ -n "$MAC_KEYCHAIN_PASSWORD" ] && [ -n "$MAC_SIGNING_IDENTITY" ]; then
            echo "EVD_MAC_SIGNING_ENABLED=1" >> "$GITHUB_ENV"
            echo "EVD_MAC_SIGN_IDENTITY=$MAC_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "Mac signing is enabled."
          else
            echo "EVD_MAC_SIGNING_ENABLED=0" >> "$GITHUB_ENV"
            echo "Mac signing secrets are incomplete; unsigned test DMG will be produced."
          fi

      - name: Import Developer ID certificate
        run: |
          if [ "$EVD_MAC_SIGNING_ENABLED" != "1" ]; then
            echo "Skipping certificate import for unsigned test build."
            exit 0
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/evd_developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/evd-signing.keychain-db"
          echo -n "$MAC_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Prepare Mac-safe package metadata
        run: |
          node build/prepare-mac-build-config.js
          echo "=== Mac package metadata ==="
          node -e "const p=require('./package.json'); console.log({version:p.version, productName:p.build.productName, executableName:p.build.executableName, mac:p.build.mac});"

      - name: Build Mac DMG (ARM64 Only)
        run: |
          set -o pipefail
          echo "Starting Mac ARM64 DMG build..."
          npm run build:mac:dmg 2>&1 | tee build_output.log


      - name: Verify macOS bundle names and signature
        run: |
          APP_PATH="$(find dist/mac-arm64 -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Built macOS app bundle was not found."
            exit 1
          fi
          BUNDLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP_PATH/Contents/Info.plist")"
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Contents/Info.plist")"
          echo "CFBundleName=$BUNDLE_NAME"
          echo "CFBundleDisplayName=$DISPLAY_NAME"
          if [ "$BUNDLE_NAME" != "Engelsiz Video Duzenleyicisi" ]; then
            echo "CFBundleName must match the ASCII executable and Helper bundle prefix."
            exit 1
          fi
          for HELPER in "Engelsiz Video Duzenleyicisi Helper.app" "Engelsiz Video Duzenleyicisi Helper (Renderer).app" "Engelsiz Video Duzenleyicisi Helper (GPU).app" "Engelsiz Video Duzenleyicisi Helper (Plugin).app"; do
            test -d "$APP_PATH/Contents/Frameworks/$HELPER" || { echo "Missing Helper bundle: $HELPER"; exit 1; }
          done
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
      - name: Sign, notarize, and staple DMG
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG_PATH="$(ls dist/*.dmg | head -n 1)"
          if [ -z "$DMG_PATH" ]; then
            echo "No DMG was produced."
            exit 1
          fi
          if [ "$EVD_MAC_SIGNING_ENABLED" != "1" ]; then
            echo "Skipping DMG signing/notarization for unsigned test build: $DMG_PATH"
            exit 0
          fi
          if [ -z "$APPLE_API_KEY_BASE64" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "Apple notarization secrets are missing; signed app was produced but DMG was not notarized."
            exit 1
          fi
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          codesign --force --sign "$MAC_SIGNING_IDENTITY" "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" --key "$API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature -vv "$DMG_PATH"

      - name: List Output
        run: |
          ls -R dist/

      - name: Upload Mac ARM64 DMG
        uses: actions/upload-artifact@v6
        with:
          name: evd-mac-arm64-dmg-v4.9.0
          path: dist/*.dmg
          retention-days: 5
