name: Build (Windows + macOS) and Draft Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ==================== WINDOWS BUILD ====================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run build:win

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/win-unpacked/
          retention-days: 30

  # ==================== MAC BUILD ====================
  build-mac:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python (native modules)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native deps for Electron
        run: npx electron-builder install-app-deps

      - name: Build macOS (per package.json)
        run: |
          set -e
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          npm run build:mac 2>&1 | tee build_output.log

      - name: List dist contents
        run: |
          echo "=== dist/ ==="
          ls -lah dist || true
          echo "=== DMGs ==="
          ls -lah dist/*.dmg 2>/dev/null || echo "No DMG found"

      # DMG'leri mount edip içindeki .app'i doğrula + arch'a göre yeniden adlandır
      - name: Verify & Normalize DMGs
        run: |
          set -euo pipefail

          mkdir -p release_files

          shopt -s nullglob
          DMGS=(dist/*.dmg)
          if [ ${#DMGS[@]} -eq 0 ]; then
            echo "::error::No DMG produced in dist/. Check electron-builder output."
            exit 1
          fi

          echo "Found DMGs:"
          printf '%s\n' "${DMGS[@]}"

          for DMG in "${DMGS[@]}"; do
            echo ""
            echo "=== Checking DMG: $DMG ==="

            # Mount read-only
            hdiutil attach "$DMG" -nobrowse -readonly -quiet

            # DMG içinde .app'i bul (volume adına bağlı kalma)
            APP=$(find /Volumes -maxdepth 2 -name "Engelsiz Video Düzenleyicisi.app" -print -quit || true)
            if [ -z "${APP}" ]; then
              echo "Volumes listing:"
              ls -lah /Volumes
              echo "::error::App not found after mounting DMG."
              # En son mount edilen volume'u sökme denemesi
              LASTVOL=$(ls -t /Volumes | head -n 1 || true)
              [ -n "${LASTVOL}" ] && hdiutil detach "/Volumes/${LASTVOL}" -quiet || true
              exit 1
            fi

            echo "App found: $APP"

            # Info.plist var mı?
            if [ ! -f "$APP/Contents/Info.plist" ]; then
              echo "::error::Info.plist missing at $APP/Contents/Info.plist"
              ls -lah "$APP/Contents" || true
              VOLROOT=$(dirname "$(dirname "$APP")")
              hdiutil detach "$VOLROOT" -quiet || true
              exit 1
            fi

            BIN="$APP/Contents/MacOS/Engelsiz Video Düzenleyicisi"
            if [ ! -f "$BIN" ]; then
              echo "::error::Main binary not found: $BIN"
              ls -lah "$APP/Contents/MacOS" || true
              VOLROOT=$(dirname "$(dirname "$APP")")
              hdiutil detach "$VOLROOT" -quiet || true
              exit 1
            fi

            echo "Binary arch:"
            file "$BIN" || true

            echo "codesign verify:"
            codesign --verify --deep --strict --verbose=4 "$APP"

            ARCH_LINE=$(file "$BIN")
            TARGET_NAME="EngelsizVideoDuzenleyici-Mac-Unknown.dmg"
            if echo "$ARCH_LINE" | grep -q "arm64"; then
              if echo "$ARCH_LINE" | grep -q "x86_64"; then
                TARGET_NAME="EngelsizVideoDuzenleyici-Mac-Universal.dmg"
              else
                TARGET_NAME="EngelsizVideoDuzenleyici-Mac-AppleSilicon.dmg"
              fi
            elif echo "$ARCH_LINE" | grep -q "x86_64"; then
              TARGET_NAME="EngelsizVideoDuzenleyici-Mac-Intel.dmg"
            fi

            echo "Copying DMG as: release_files/$TARGET_NAME"
            cp "$DMG" "release_files/$TARGET_NAME"

            # Unmount volume root
            VOLROOT=$(dirname "$(dirname "$APP")")
            hdiutil detach "$VOLROOT" -quiet || true
          done

          echo ""
          echo "=== release_files ==="
          ls -lah release_files

      - name: Upload macOS Release Files
        uses: actions/upload-artifact@v4
        with:
          name: mac-release-files
          path: release_files/*.dmg
          retention-days: 30

  # ==================== RELEASE (Tag) ====================
  create-release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare Release Files
        run: |
          set -e
          mkdir -p release_files

          # Windows: klasör olarak indiği için zip'le
          if [ -d "artifacts/windows-build" ]; then
            (cd artifacts && zip -r ../release_files/EngelsizVideoDuzenleyici-Windows.zip windows-build/)
          fi

          # macOS: doğrudan DMG'ler (zip yok)
          if [ -d "artifacts/mac-release-files" ]; then
            cp artifacts/mac-release-files/*.dmg release_files/ 2>/dev/null || true
          fi

          echo "Release files:"
          ls -lah release_files

      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          files: |
            release_files/EngelsizVideoDuzenleyici-Windows.zip
            release_files/EngelsizVideoDuzenleyici-Mac-Intel.dmg
            release_files/EngelsizVideoDuzenleyici-Mac-AppleSilicon.dmg
            release_files/EngelsizVideoDuzenleyici-Mac-Universal.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
