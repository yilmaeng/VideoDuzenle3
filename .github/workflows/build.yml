name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build Windows (no publish)
        run: npx electron-builder --win --publish=never

      - name: List dist
        if: always()
        shell: bash
        run: |
          echo "=== dist ==="
          ls -la dist/ || true

      - name: Upload Windows dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/**
          retention-days: 30

  build-mac:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python (native modules)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: npm ci

      - name: Build mac (capture log, no publish)
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder --mac --publish=never 2>&1 | tee build_output_mac.log
          exit ${PIPESTATUS[0]}

      - name: Show dist tree
        if: always()
        shell: bash
        run: |
          echo "=== dist root ==="
          ls -la dist/ || true
          echo "=== find dmg ==="
          find dist -maxdepth 2 -name "*.dmg" -type f -print || true
          echo "=== find zip ==="
          find dist -maxdepth 2 -name "*.zip" -type f -print || true

      - name: Upload mac build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log
          path: build_output_mac.log
          retention-days: 30

      - name: Upload Mac dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: dist/**
          retention-days: 30

  create-release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_files

          echo "=== Artifacts tree ==="
          find artifacts -maxdepth 4 -type f -print || true

          # Windows: tüm dist'i zipleyelim
          if [ -d "artifacts/windows-dist" ]; then
            (cd artifacts && zip -r ../release_files/EngelsizVideoDuzenleyici-Windows.zip windows-dist >/dev/null)
          fi

          # Mac: tüm DMG'leri bul ve adlandır
          ARM_DMG=$(find artifacts -name "*.dmg" -type f | grep -i "arm64" | head -n 1 || true)
          X64_DMG=$(find artifacts -name "*.dmg" -type f | grep -Ei "(x64|intel)" | head -n 1 || true)

          # Eğer isimlerde arch yoksa ilk iki dmg'yi al
          if [ -z "$ARM_DMG" ] || [ -z "$X64_DMG" ]; then
            DMGS=($(find artifacts -name "*.dmg" -type f | head -n 2))
            [ -z "$ARM_DMG" ] && [ "${#DMGS[@]}" -ge 1 ] && ARM_DMG="${DMGS[0]}"
            [ -z "$X64_DMG" ] && [ "${#DMGS[@]}" -ge 2 ] && X64_DMG="${DMGS[1]}"
          fi

          if [ -n "$ARM_DMG" ]; then
            cp "$ARM_DMG" release_files/EngelsizVideoDuzenleyici-Mac-AppleSilicon.dmg
          fi

          if [ -n "$X64_DMG" ]; then
            cp "$X64_DMG" release_files/EngelsizVideoDuzenleyici-Mac-Intel.dmg
          fi

          echo "=== Release files ==="
          ls -la release_files || true

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          files: |
            release_files/EngelsizVideoDuzenleyici-Windows.zip
            release_files/EngelsizVideoDuzenleyici-Mac-AppleSilicon.dmg
            release_files/EngelsizVideoDuzenleyici-Mac-Intel.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
