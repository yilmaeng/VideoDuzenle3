<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="dialog.text_overlay_window.title">Yazı Ekle</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }

        h2 {
            margin-top: 0;
            color: #fff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #b0b0b0;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #2d2d2d;
            color: #fff;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        input[type="range"] {
            padding: 0;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input {
            width: auto;
        }

        .checkbox-group label {
            margin: 0;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #444;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button.primary {
            background: #0078d4;
            color: white;
        }

        button.secondary {
            background: #444;
            color: #fff;
        }

        button:hover {
            opacity: 0.9;
        }

        #tts-options {
            background: #252525;
            padding: 15px;
            border-radius: 4px;
            margin-top: 10px;
        }

        .ai-section {
            background: #1a2a3a;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            border: 1px solid #3a5a7a;
        }

        .ai-section h3 {
            margin: 0 0 15px 0;
            color: #7ab3ff;
            font-size: 16px;
        }

        .ai-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        #ai-response {
            width: 100%;
            background: #0a1520;
            color: #e0e0e0;
            border: 1px solid #3a5a7a;
            padding: 10px;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
        }

        .followup-section {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }

        .followup-section label {
            white-space: nowrap;
        }

        .followup-section input {
            flex: 1;
        }

        #ai-loading {
            color: #7ab3ff;
            font-style: italic;
        }
    </style>
</head>

<body>
    <h2 data-i18n="dialog.text_overlay_window.title">Yazı Ekle</h2>

    <form id="text-form">
        <!-- Metin -->
        <div class="form-group">
            <label for="text-content" data-i18n="dialog.text_overlay_window.content">Metin:</label>
            <textarea id="text-content" data-i18n-placeholder="dialog.text_overlay_window.content_placeholder" placeholder="Görüntülenecek metni yazın..." autofocus></textarea>
        </div>

        <div class="row">
            <!-- Yazı Tipi -->
            <div class="form-group">
                <label for="font" data-i18n="dialog.text_overlay_window.font">Yazı Tipi:</label>
                <select id="font">
                    <option value="arial" data-i18n="dialog.text_overlay_window.font_arial">Arial</option>
                    <option value="times" data-i18n="dialog.text_overlay_window.font_times">Times New Roman</option>
                    <option value="courier" data-i18n="dialog.text_overlay_window.font_courier">Courier New</option>
                    <option value="verdana" data-i18n="dialog.text_overlay_window.font_verdana">Verdana</option>
                    <option value="tahoma" data-i18n="dialog.text_overlay_window.font_tahoma">Tahoma</option>
                </select>
            </div>

            <!-- Yazı Boyutu -->
            <div class="form-group">
                <label for="size" data-i18n="dialog.text_overlay_window.size">Boyut:</label>
                <input type="number" id="size" value="48" min="8" max="300" data-i18n-placeholder="dialog.text_overlay_window.size_placeholder" placeholder="Örn: 48">
            </div>
        </div>

        <div class="row">
            <!-- Yazı Rengi -->
            <div class="form-group">
                <label for="color" data-i18n="dialog.text_overlay_window.color">Yazı Rengi:</label>
                <select id="color">
                    <option value="white" data-i18n="dialog.text_overlay.color_white">Beyaz</option>
                    <option value="black" data-i18n="dialog.text_overlay.color_black">Siyah</option>
                    <option value="yellow" data-i18n="dialog.text_overlay.color_yellow">Sarı</option>
                    <option value="red" data-i18n="dialog.text_overlay.color_red">Kırmızı</option>
                    <option value="green" data-i18n="dialog.text_overlay.color_green">Yeşil</option>
                    <option value="blue" data-i18n="dialog.text_overlay.color_blue">Mavi</option>
                </select>
            </div>

            <!-- Arka Plan -->
            <div class="form-group">
                <label for="bg" data-i18n="dialog.text_overlay_window.background">Arka Plan:</label>
                <select id="bg">
                    <option value="none" data-i18n="dialog.text_overlay_window.bg_none">Yok (Şeffaf)</option>
                    <option value="black@0.5" data-i18n="dialog.text_overlay_window.bg_black_transparent">Siyah (Yarı Saydam)</option>
                    <option value="black" data-i18n="dialog.text_overlay.color_black">Siyah</option>
                    <option value="white@0.5" data-i18n="dialog.text_overlay_window.bg_white_transparent">Beyaz (Yarı Saydam)</option>
                    <option value="white" data-i18n="dialog.text_overlay.color_white">Beyaz</option>
                </select>
            </div>
        </div>

        <div class="row">
            <!-- Gölge -->
            <div class="form-group">
                <label for="shadow" data-i18n="dialog.text_overlay_window.shadow">Gölge:</label>
                <select id="shadow">
                    <option value="none" data-i18n="dialog.text_overlay_window.shadow_none">Yok</option>
                    <option value="small" data-i18n="dialog.text_overlay_window.shadow_small">Hafif</option>
                    <option value="medium" data-i18n="dialog.text_overlay_window.shadow_medium">Orta</option>
                    <option value="large" data-i18n="dialog.text_overlay_window.shadow_large">Güçlü</option>
                </select>
            </div>

            <!-- Konum -->
            <div class="form-group">
                <label for="position" data-i18n="dialog.text_overlay_window.position">Konum:</label>
                <select id="position">
                    <option value="top-left" data-i18n="dialog.text_overlay_window.pos_top_left">Sol Üst</option>
                    <option value="top-center" data-i18n="dialog.text_overlay_window.pos_top_center">Üst Orta</option>
                    <option value="top-right" data-i18n="dialog.text_overlay_window.pos_top_right">Sağ Üst</option>
                    <option value="middle-left" data-i18n="dialog.text_overlay_window.pos_middle_left">Sol Orta</option>
                    <option value="center" data-i18n="dialog.text_overlay_window.pos_center">Tam Orta</option>
                    <option value="middle-right" data-i18n="dialog.text_overlay_window.pos_middle_right">Sağ Orta</option>
                    <option value="bottom-left" data-i18n="dialog.text_overlay_window.pos_bottom_left">Sol Alt</option>
                    <option value="bottom-center" selected data-i18n="dialog.text_overlay_window.pos_bottom_center">Alt Orta</option>
                    <option value="bottom-right" data-i18n="dialog.text_overlay_window.pos_bottom_right">Sağ Alt</option>
                    <option value="custom" data-i18n="dialog.text_overlay_window.pos_custom">Özel Koordinat (X/Y)</option>
                </select>
            </div>

            <!-- Özel Koordinatlar -->
            <div class="form-group" id="custom-coordinates-group" style="display: none;">
                <label data-i18n="dialog.text_overlay_window.custom_coordinates">İnce Ayar (X ve Y):</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="posX" data-i18n-placeholder="dialog.text_overlay_window.pos_x_placeholder" placeholder="X (Örn: 100)">
                    <input type="number" id="posY" data-i18n-placeholder="dialog.text_overlay_window.pos_y_placeholder" placeholder="Y (Örn: 200)">
                </div>
            </div>

            <!-- Geçiş -->
            <div class="form-group">
                <label for="transition" data-i18n="dialog.text_overlay_window.transition">Geçiş:</label>
                <select id="transition">
                    <option value="none" data-i18n="dialog.text_overlay_window.transition_none">Anında</option>
                    <option value="fade" data-i18n="dialog.text_overlay_window.transition_fade">Solarak Gir/Çık</option>
                </select>
            </div>
        </div>

        <!-- Süre -->
        <div class="form-group">
            <label for="duration" data-i18n="dialog.text_overlay_window.duration">Süre (saniye):</label>
            <input type="number" id="duration" value="5" min="1" max="300">
        </div>

        <!-- Tüm video boyunca -->
        <div class="form-group checkbox-group">
            <input type="checkbox" id="whole-video">
            <label for="whole-video" data-i18n="dialog.text_overlay_window.whole_video">Tüm video boyunca göster (0'dan sona)</label>
        </div>



        <!-- TTS -->
        <div class="form-group checkbox-group">
            <input type="checkbox" id="tts-enable">
            <label for="tts-enable" data-i18n="dialog.text_overlay_window.tts_enable">Yazıyı seslendir (TTS)</label>
        </div>

        <div id="tts-options" class="style-box" style="display: none;">
            <div class="form-group">
                <label for="tts-service" data-i18n="dialog.text_overlay_window.tts_service">Seslendirme Servisi:</label>
                <select id="tts-service">
                    <option value="system" data-i18n="dialog.text_overlay_window.tts_service_system">Bilgisayar sesleri</option>
                    <option value="openai" data-i18n="dialog.text_overlay_window.tts_service_openai">OpenAI</option>
                    <option value="elevenlabs" data-i18n="dialog.text_overlay_window.tts_service_elevenlabs">ElevenLabs</option>
                </select>
                <p class="hint" data-i18n="dialog.text_overlay_window.tts_service_hint">OpenAI ve ElevenLabs için Yapay Zeka menüsünde API anahtarınız kayıtlı olmalıdır.</p>
            </div>
            <!-- Dil/Ses -->
            <div class="form-group">
                <label for="tts-voice" data-i18n="dialog.text_overlay_window.tts_voice">Seslendirmen:</label>
                <select id="tts-voice">
                    <option value="" data-i18n="dialog.text_overlay_window.tts_voice_default">Varsayılan (Türkçe)</option>
                </select>
            </div>

            <!-- Hız ve TTS Ses -->
            <div class="row">
                <div class="form-group" style="flex: 1;">
                    <label for="tts-speed"><span data-i18n="dialog.text_overlay_window.tts_speed">Hız:</span> <span id="tts-speed-value">%100</span></label>
                    <input type="range" id="tts-speed" min="50" max="200" value="100">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="tts-volume"><span data-i18n="dialog.text_overlay_window.tts_volume">TTS Sesi:</span> <span id="tts-volume-value">%100</span></label>
                    <input type="range" id="tts-volume" min="0" max="100" value="100">
                </div>
            </div>

            <!-- Video Ses ve Dinle Butonu -->
            <div class="row" style="align-items: flex-end;">
                <div class="form-group" style="flex: 1;">
                    <label for="video-volume"><span data-i18n="dialog.text_overlay_window.video_volume">Video Sesi (Mix Oranı):</span> <span id="video-volume-value">%100</span></label>
                    <input type="range" id="video-volume" min="0" max="100" value="100">
                </div>
                <div class="form-group" style="flex: 0 0 auto; margin-left: 10px;">
                    <button type="button" id="tts-preview-btn" class="secondary" style="height: 38px; min-width: 80px;">
                        <i class="fas fa-play"></i> <span data-i18n="dialog.text_overlay_window.tts_preview">Dinle</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Yapay Zeka Geri Bildirimi -->
        <div class="ai-section">
            <h3 data-i18n="dialog.text_overlay_window.ai_section">Yapay Zeka Geri Bildirimi</h3>

            <!-- Model Seçimi -->
            <div class="form-group">
                <label for="gemini-model" data-i18n="dialog.text_overlay_window.gemini_model">Gemini Modeli:</label>
                <select id="gemini-model">
                    <option value="gemini-2.5-flash" selected data-i18n="dialog.text_overlay_window.model_flash">Gemini 2.5 Flash (Önerilen)</option>
                    <option value="gemini-2.5-pro" data-i18n="dialog.text_overlay_window.model_pro">Gemini 2.5 Pro</option>
                    <option value="gemini-1.5-flash" data-i18n="dialog.text_overlay_window.model_flash_legacy">Gemini 1.5 Flash (Kota Dostu)</option>
                </select>
            </div>

            <!-- API Anahtarı (ilk kullanımda gösterilir) -->
            <div id="api-key-section" class="form-group" style="display: none;">
                <label for="gemini-api-key" data-i18n="dialog.text_overlay_window.api_key">Gemini API Anahtarı:</label>
                <input type="password" id="gemini-api-key" data-i18n-placeholder="dialog.text_overlay_window.api_key_placeholder" placeholder="API anahtarınızı girin">
                <div class="checkbox-group">
                    <input type="checkbox" id="save-api-key" checked>
                    <label for="save-api-key" data-i18n="dialog.text_overlay_window.save_api_key">Bu anahtarı kaydet</label>
                </div>
            </div>

            <!-- AI Butonları -->
            <div class="ai-buttons">
                <button type="button" id="ai-feedback-btn" class="secondary" data-i18n="dialog.text_overlay_window.ai_feedback">Mevcut Durumu Yorumla</button>
                <button type="button" id="ai-suggest-btn" class="secondary" style="background-color: #2b5d2b;" data-i18n="dialog.text_overlay_window.ai_suggest">Stil ve
                    Konum Öner</button>
                <button type="button" id="change-api-key-btn" class="secondary" style="font-size: 12px;" data-i18n="dialog.text_overlay_window.api_key_button">API
                    Anahtarı</button>
            </div>

            <!-- AI Yanıt Alanı -->
            <div id="ai-response-section" class="form-group" style="display: none;">
                <label for="ai-response" data-i18n="dialog.text_overlay_window.ai_response">Yapay Zeka Yanıtı:</label>
                <!-- Analiz edilen görüntü önizlemesi -->
                <div id="ai-preview-container" style="display: none; margin-bottom: 10px; text-align: center;"></div>
                <textarea id="ai-response" readonly rows="6"></textarea>
                <!-- Ekran okuyucu için canlı duyuru alanı -->
                <div id="ai-live-region" aria-live="assertive" aria-atomic="true"
                    style="position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden;"></div>

                <!-- Takip Sorusu -->
                <div class="followup-section">
                    <label for="followup-question" data-i18n="dialog.text_overlay_window.followup">Ek Soru Sor:</label>
                    <input type="text" id="followup-question" data-i18n-placeholder="dialog.text_overlay_window.followup_placeholder" placeholder="Sorunuzu yazın...">
                    <button type="button" id="ask-followup-btn" class="secondary" data-i18n="dialog.text_overlay_window.ask">Sor</button>
                </div>
            </div>

            <!-- Yükleniyor göstergesi -->
            <div id="ai-loading" style="display: none;">
                <p data-i18n="dialog.text_overlay_window.ai_loading">Yapay zeka yanıtı bekleniyor...</p>
            </div>
        </div>

        <div class="buttons">
            <button type="button" class="secondary" id="close-btn" data-i18n="dialog.common.close">Kapat</button>
            <button type="button" class="primary" id="apply-btn" data-i18n="dialog.text_overlay_window.apply">Videoya Ekle</button>
            <button type="button" class="primary" id="add-to-list-btn" data-i18n="dialog.text_overlay_window.add_to_list">Listeye Ekle</button>
        </div>
    </form>

    <script>
        const { ipcRenderer } = require('electron');
        let editingId = null; // Düzenleme modunda öğe ID'si
        let i18nCache = {};
        let currentLang = 'tr';
        let currentTtsPreviewAudio = null;
        let ttsPreviewRequestId = 0;

        function getPathValue(obj, path) {
            return path.split('.').reduce((acc, key) => acc && acc[key] !== undefined ? acc[key] : null, obj);
        }

        function t(key, fallback, params = {}) {
            const value = getPathValue(i18nCache, key) || fallback;
            return Object.entries(params).reduce(
                (result, [paramKey, paramValue]) => result.replace(new RegExp(`\\{${paramKey}\\}`, 'g'), paramValue),
                value
            );
        }

        function translateDocument() {
            document.documentElement.lang = currentLang;
            document.querySelectorAll('[data-i18n]').forEach((el) => {
                const key = el.getAttribute('data-i18n');
                if (!key) return;
                const value = getPathValue(i18nCache, key);
                if (value) el.textContent = value;
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (!key) return;
                const value = getPathValue(i18nCache, key);
                if (value) el.setAttribute('placeholder', value);
            });
            const titleEl = document.querySelector('title[data-i18n]');
            if (titleEl) {
                const value = getPathValue(i18nCache, titleEl.getAttribute('data-i18n'));
                if (value) document.title = value;
            }
        }

        async function initI18n() {
            currentLang = await ipcRenderer.invoke('i18n-get-language');
            i18nCache = await ipcRenderer.invoke('i18n-get-all');
            translateDocument();
        }

        function getCurrentAiLanguageName() {
            const names = {
                tr: 'Turkish',
                en: 'English',
                de: 'German',
                es: 'Spanish',
                fr: 'French'
            };
            return names[currentLang] || 'English';
        }

        function getAiSystemInstruction(mode = 'default') {
            const lang = getCurrentAiLanguageName();
            return mode === 'json'
                ? t('runtime.dialogs.ai_system_instruction_json', 'Respond only in {lang}. If JSON output is requested, keep all JSON keys and schema exactly as requested while writing any free text values in {lang}.', { lang })
                : t('runtime.dialogs.ai_system_instruction', 'Respond only in {lang}. Keep the same response language in follow-up answers.', { lang });
        }

        function buildTextOverlayFeedbackPrompt(formData, resolutionInfo) {
            if (currentLang === 'tr') {
                return `Görme engelli bir kullanıcıyım ve videoma bir yazı ekledim.

Video Çözünürlüğü: ${resolutionInfo}
Yazı bilgileri:
- Metin: "${formData.text.replace(/\n/g, '\\n')}" (Not: \\n kısımları kullanıcının metni satırlara böldüğü yerlerdir)
- Yazı tipi: ${formData.font}
- Boyut: ${formData.fontSize}px
- Yazı rengi: ${formData.fontColor}
- Arka plan: ${formData.background}
- Konum: ${formData.position === 'custom' ? `Özel (X:${formData.customX}, Y:${formData.customY})` : formData.position}

Bana yazıyı eklediğim sahneyi kısaca betimle. Sonrasında eklediğim yazının boyutu, konumu ve metin uzunluğu bakımından ${resolutionInfo} çözünürlüğe uygun olup olmadığını analiz et. Ekrana tam sığıyor mu, kenarlardan taşıyor mu, görselle uyumlu mu, okunabilir mi bunları net şekilde belirt. Gerekirse metni satırlara bölme veya boyutu küçültme gibi öneriler de ver.

Yanıtının tamamını yalnızca Türkçe ver.`;
            }

            const lang = getCurrentAiLanguageName();
            return `I am a blind user and I added a text overlay to my video.

Video resolution: ${resolutionInfo}
Text settings:
- Text: "${formData.text.replace(/\n/g, '\\n')}" (Note: \\n shows where the user split the text into lines)
- Font: ${formData.font}
- Size: ${formData.fontSize}px
- Text color: ${formData.fontColor}
- Background: ${formData.background}
- Position: ${formData.position === 'custom' ? `Custom (X:${formData.customX}, Y:${formData.customY})` : formData.position}

Briefly describe the scene where I placed the text. Then analyze whether the text size, position, and line length fit the ${resolutionInfo} resolution. State clearly whether it fully fits on screen, overflows from the edges, matches the visual composition, and remains readable. If needed, suggest splitting the text into multiple lines or reducing the size.

Write the full answer only in ${lang}.`;
        }

        function buildTextOverlayFollowupPrompt(formData, resolutionInfo, question) {
            if (currentLang === 'tr') {
                return `Video Çözünürlüğü: ${resolutionInfo}
Güncel yazı ayarları:
- Metin: "${formData.text.replace(/\n/g, '\\n')}" (Not: \\n kısımları kullanıcının metni satırlara böldüğü yerlerdir)
- Yazı tipi: ${formData.font}
- Boyut: ${formData.fontSize}px
- Yazı rengi: ${formData.fontColor}
- Arka plan: ${formData.background}
- Konum: ${formData.position === 'custom' ? `Özel (X:${formData.customX}, Y:${formData.customY})` : formData.position}

Yanıt verirken bu metnin ${resolutionInfo} çözünürlüğündeki ekrana tam olarak sığıp sığmadığını ve taşıp taşmadığını da değerlendir.

Kullanıcının ek sorusu: ${question}

Yanıtının tamamını yalnızca Türkçe ver.`;
            }

            const lang = getCurrentAiLanguageName();
            return `Video resolution: ${resolutionInfo}
Current text settings:
- Text: "${formData.text.replace(/\n/g, '\\n')}" (Note: \\n shows where the user split the text into lines)
- Font: ${formData.font}
- Size: ${formData.fontSize}px
- Text color: ${formData.fontColor}
- Background: ${formData.background}
- Position: ${formData.position === 'custom' ? `Custom (X:${formData.customX}, Y:${formData.customY})` : formData.position}

While answering, always evaluate whether this text fully fits within the ${resolutionInfo} frame and whether it overflows.

User follow-up question: ${question}

Write the full answer only in ${lang}.`;
        }

        function buildTextOverlaySuggestionPrompt(formData, resolutionInfo) {
            if (currentLang === 'tr') {
                return `Video çözünürlüğü: ${resolutionInfo}
Video karesini ve şu metni analiz et: "${formData.text.replace(/\n/g, '\\n')}" (Not: \\n kısımları kullanıcının metni satırlara böldüğü yerlerdir)
Videonun özelliklerine ve ${resolutionInfo} çözünürlüğüne göre yazının videoya sığması çok önemlidir.
Metnin videoda en okunaklı, estetik ve profesyonel görünmesi için en uygun konumu, boyutu, rengi ve fontu belirle.
Gerekirse metnin tek satırda değil de birkaç satıra bölünmesi için suggestedText alanı verebilirsin (örneğin \\n kullanarak satır atlaması önerebilirsin).

        // Sayfa yüklendiğinde TTS seslerini yükle
        function getSelectedTtsService() {
            return document.getElementById('tts-service')?.value || 'system';
        }

        async function loadTtsVoices(selectedVoice = '') {
            try {
                const service = getSelectedTtsService();
                const result = await ipcRenderer.invoke('get-tts-voices', { service });
                console.log('TTS sesleri:', result);

                if (result.success && result.voices && result.voices.length > 0) {
                    const voiceSelect = document.getElementById('tts-voice');

                    // Mevcut seçenekleri temizle (Varsayılan hariç)
                    voiceSelect.innerHTML = `<option value="">${t('dialog.text_overlay_window.tts_voice_default', 'Default')}</option>`;

                    // Yeni sesleri ekle
                    result.voices.forEach(voice => {
                        const voiceId = typeof voice === 'string' ? voice : voice?.id;
                        const voiceName = typeof voice === 'string' ? voice : voice?.name;
                        if (voiceId && voiceName && voiceName !== 'Varsayılan') {
                            const option = document.createElement('option');
                            option.value = voiceId;
                            option.textContent = voiceName;
                            voiceSelect.appendChild(option);
                        }
                    });
                    if (selectedVoice && Array.from(voiceSelect.options).some((option) => option.value === selectedVoice)) {
                        voiceSelect.value = selectedVoice;
                    }

                    console.log('TTS sesleri yüklendi:', result.voices.length);
                } else {
                    const voiceSelect = document.getElementById('tts-voice');
                    voiceSelect.innerHTML = `<option value="">${t('dialog.text_overlay_window.tts_voice_default', 'Default')}</option>`;
                }
            } catch (error) {
                console.error('TTS sesleri yüklenemedi:', error);
                const voiceSelect = document.getElementById('tts-voice');
                voiceSelect.innerHTML = `<option value="">${t('dialog.text_overlay_window.tts_voice_load_failed', 'Sesler yüklenemedi')}</option>`;

        // TTS Önizleme Butonu
        document.getElementById('tts-preview-btn').addEventListener('click', async () => {
            const text = document.getElementById('text-content').value.trim();
            if (!text) {
                alert(t('dialog.text_overlay_window.enter_text_for_tts', 'Enter text to preview speech.'));
                return;
            }

            const btn = document.getElementById('tts-preview-btn');
            const originalText = btn.innerHTML;
            const requestId = ++ttsPreviewRequestId;

            if (currentTtsPreviewAudio) {
                currentTtsPreviewAudio.pause();
                currentTtsPreviewAudio.currentTime = 0;
                currentTtsPreviewAudio = null;
            }

            btn.disabled = true;
            btn.textContent = t('dialog.text_overlay_window.generating', 'Generating...');

            try {
                const voice = document.getElementById('tts-voice').value;
                const service = getSelectedTtsService();
                // Değerler 0-100 veya 0.5-2.0 arası değişmeli.
                // HTML range: speed 50-200 -> 0.5-2.0
                // HTML range: volume 0-100 -> 0-100
                const speed = parseInt(document.getElementById('tts-speed').value) / 100;
                const volume = parseInt(document.getElementById('tts-volume').value); // API 0-100 bekliyor
                const videoVolume = parseInt(document.getElementById('video-volume').value);
                const durationInput = parseFloat(document.getElementById('duration').value);
                const previewDuration = document.getElementById('whole-video').checked
                    ? 5
                    : (Number.isFinite(durationInput) && durationInput > 0 ? Math.min(durationInput, 15) : 5);

                console.log('TTS Preview isteği:', {
                    text: text.substring(0, 30),
                    voice,
                    speed,
                    volume,
                    videoVolume,
                    previewDuration,
                    hasVideo: !!window.videoPath
                });

                const result = await ipcRenderer.invoke('preview-tts', {
                    text,
                    voice,
                    service,
                    speed,
                    volume,
                    videoPath: window.videoPath || '',
                    startTime: window.startTime || 0,
                    duration: previewDuration,
                    videoVolume
                });

                console.log('TTS Preview sonucu:', result.success, result.audioPath || result.spokeDirect || result.error);

                if (requestId !== ttsPreviewRequestId) {
                    return;
                }

                if (result.success && result.audioPath) {
                    // Dosya yolunu file:// URL'e çevir
                    const fileUrl = 'file:///' + result.audioPath.replace(/\\/g, '/');
                    console.log('TTS Audio URL:', fileUrl);

                    const audio = new Audio(fileUrl);
                    currentTtsPreviewAudio = audio;

                    audio.onerror = (e) => {
                        console.error('Audio oynatma hatası:', e);
                        currentTtsPreviewAudio = null;
                        alert(t('dialog.text_overlay_window.audio_play_failed', 'The audio could not be played.'));
                    };

                    audio.onended = () => {
                        console.log('TTS oynatma tamamlandı');
                        if (currentTtsPreviewAudio === audio) {
                            currentTtsPreviewAudio = null;
                        }
                    };

                    btn.textContent = t('dialog.text_overlay_window.playing', 'Playing...');
                    await audio.play();
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    return;
                } else if (result.success && result.spokeDirect) {
                    // Doğrudan hoparlörden okuma (say.js fallback)
                    btn.textContent = t('dialog.text_overlay_window.speaking', 'Speaking...');
                    console.log('TTS doğrudan hoparlörden okuma başlatıldı');
                } else {
                    alert(t('dialog.text_overlay_window.audio_generation_failed', 'Audio could not be generated: {error}', {
                        error: result.error || t('runtime.dialogs.unknown_error', 'Unknown error')
                    }));
                }
            } catch (e) {
                console.error('TTS Preview hatası:', e);
                if (requestId === ttsPreviewRequestId) {
                    currentTtsPreviewAudio = null;
                }
                alert(t('runtime.common.error', 'Error: {error}', { error: e.message }));
            } finally {
                if (requestId === ttsPreviewRequestId && !currentTtsPreviewAudio) {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            }
        });

        // AI geri bildirimi al
        async function getAiFeedback(customPrompt = null) {
            const formData = collectFormData();
            if (!formData) {
                alert(t('dialog.text_overlay_window.enter_text_first', 'Please enter text first.'));
                return;
            }

            // API anahtarını kontrol et
            let apiKey = await checkApiKey();
            if (!apiKey) {
                const keyInput = document.getElementById('gemini-api-key');
                if (!keyInput.value.trim()) {
                    alert(t('dialog.text_overlay_window.enter_api_key', 'Please enter your Gemini API key.'));
                    keyInput.focus();
                    return;
                }
                apiKey = keyInput.value.trim();

                // Kaydetme seçeneği
                if (document.getElementById('save-api-key').checked) {
                    await ipcRenderer.invoke('save-gemini-api-key', apiKey);
                }
                document.getElementById('api-key-section').style.display = 'none';
            }

            // Yükleniyor göster
            document.getElementById('ai-loading').style.display = 'block';
            document.getElementById('ai-feedback-btn').disabled = true;

            try {
                // Video karesini al
                const frameData = await ipcRenderer.invoke('extract-frame-base64', {
                    time: window.startTime || 0,
                    videoPath: window.videoPath
                });

                // Çözünürlük bilgisi
                let resolutionInfo = "Bilinmiyor";
                try {
                    const metadataResult = await ipcRenderer.invoke('get-video-metadata', window.videoPath);
                    if (metadataResult && metadataResult.success && metadataResult.data) {
                        resolutionInfo = `${metadataResult.data.width}x${metadataResult.data.height}`;
                    }
                } catch (e) { console.warn("Metadata alınamadı:", e); }

                // Prompt hazırlığı
                const finalPrompt = customPrompt
                    ? buildTextOverlayFollowupPrompt(formData, resolutionInfo, customPrompt)
                    : buildTextOverlayFeedbackPrompt(formData, resolutionInfo);

                // Konuşma geçmişine ekle
                conversationHistory.push({ role: 'user', content: finalPrompt });

                // Seçilen modeli al
                const selectedModel = document.getElementById('gemini-model').value;

                // Gemini'ye gönder
                const result = await ipcRenderer.invoke('gemini-vision-request', {
                    apiKey,
                    model: selectedModel,
                    imageBase64: frameData,
                    prompt: finalPrompt,
                    history: conversationHistory.slice(0, -1), // Son eklenenı hariç tut
                    systemInstruction: getAiSystemInstruction()
                });

                if (!result.success) {
                    throw new Error(result.error || t('runtime.dialogs.unknown_error', 'Unknown error'));
                }

                const response = result.text;

                // Yanıtı göster
                document.getElementById('ai-response-section').style.display = 'block';
                const responseArea = document.getElementById('ai-response');
                responseArea.value = response;

                // Konuşma geçmişine ekle
                conversationHistory.push({ role: 'assistant', content: response });

                // Ekran okuyucu için otomatik oku (aria-live assertive)
                const liveRegion = document.getElementById('ai-live-region');
                // Önce temizle sonra yeni içerik ekle (değişiklik algılaması için)
                liveRegion.textContent = '';
                setTimeout(() => {
                    liveRegion.textContent = t('dialog.text_overlay_window.ai_response_announce', 'AI response: {response}', {
                        response
                    });
                }, 100);

                // Yanıt alanına odaklan
                responseArea.focus();

            } catch (error) {
                alert(t('dialog.text_overlay_window.ai_error', 'AI error: {error}', { error: error.message }));
            } finally {
                document.getElementById('ai-loading').style.display = 'none';
                document.getElementById('ai-feedback-btn').disabled = false;
            }
        }

        // AI stil önerisi al
        async function getAiStyleSuggestion() {
            const formData = collectFormData();
            if (!formData || !formData.text) {
                alert(t('dialog.text_overlay_window.enter_text_first', 'Please enter text first.'));
                document.getElementById('text-content').focus();
                return;
            }

            // API anahtarını kontrol et
            let apiKey = await checkApiKey();
            if (!apiKey) {
                // ... (anahtar isteme mantığı, checkApiKey içinde zaten UI açılıyor ama burada da tetiklenebilir)
                const keyInput = document.getElementById('gemini-api-key');
                if (!keyInput.value.trim()) {
                    alert(t('dialog.text_overlay_window.enter_api_key', 'Please enter your Gemini API key.'));
                    keyInput.focus();
                    return;
                }
                apiKey = keyInput.value.trim();
                if (document.getElementById('save-api-key').checked) {
                    await ipcRenderer.invoke('save-gemini-api-key', apiKey);
                }
                document.getElementById('api-key-section').style.display = 'none';
            }

            // Yükleniyor
            document.getElementById('ai-loading').style.display = 'block';
            document.getElementById('ai-suggest-btn').disabled = true;
            document.getElementById('ai-feedback-btn').disabled = true;

            try {
                // Video karesini al
                const frameData = await ipcRenderer.invoke('extract-frame-base64', {
                    time: window.startTime || 0,
                    videoPath: window.videoPath
                });

                // Çözünürlük bilgisi
                let resolutionInfo = "Bilinmiyor";
                try {
                    const metadataResult = await ipcRenderer.invoke('get-video-metadata', window.videoPath);
                    if (metadataResult && metadataResult.success && metadataResult.data) {
                        resolutionInfo = `${metadataResult.data.width}x${metadataResult.data.height}`;
                    }
                } catch (e) { }

                // Prompt
                const prompt = buildTextOverlaySuggestionPrompt(formData, resolutionInfo);

                const selectedModel = document.getElementById('gemini-model').value;

                const result = await ipcRenderer.invoke('gemini-vision-request', {
                    apiKey,
                    model: selectedModel,
                    imageBase64: frameData,
                    prompt: prompt,
                    history: [],
                    systemInstruction: getAiSystemInstruction('json')
                });

                if (!result.success) {
                    throw new Error(result.error);
                }

                // JSON'ı parse etmeye çalış
                let suggestion;
                try {
                    let cleanedText = result.text.replace(/```json/g, '').replace(/```/g, '').trim();
                    suggestion = JSON.parse(cleanedText);
                } catch (e) {
                    console.error('JSON parse hatası:', e);
                    throw new Error('Yapay zeka geçerli bir format üretmedi. Lütfen tekrar deneyin.');
                }

                // Önerileri uygula
                if (suggestion) {
                    if (suggestion.position) {
                        document.getElementById('position').value = suggestion.position;
                        if (suggestion.position === 'custom') {
                            document.getElementById('custom-coordinates-group').style.display = 'block';
                            if (suggestion.customX !== undefined) document.getElementById('posX').value = suggestion.customX;
                            if (suggestion.customY !== undefined) document.getElementById('posY').value = suggestion.customY;
                        } else {
                            document.getElementById('custom-coordinates-group').style.display = 'none';
                        }
                    }
                    if (suggestion.fontSize) document.getElementById('size').value = String(suggestion.fontSize);
                    if (suggestion.fontColor) document.getElementById('color').value = suggestion.fontColor;
                    if (suggestion.backgroundColor) document.getElementById('bg').value = suggestion.backgroundColor;
                    if (suggestion.shadow) document.getElementById('shadow').value = suggestion.shadow;
                    if (suggestion.fontFamily) document.getElementById('font').value = suggestion.fontFamily;

                    if (suggestion.suggestedText) {
                        document.getElementById('text-content').value = suggestion.suggestedText;
                    }

                    const positionText = suggestion.position === 'custom'
                        ? t('dialog.text_overlay_window.custom_position_value', 'Custom (X:{x}, Y:{y})', {
                            x: suggestion.customX,
                            y: suggestion.customY
                        })
                        : suggestion.position;
                    const message = t(
                        'dialog.text_overlay_window.suggestion_applied_message',
                        'Suggestion applied:\nPosition: {position}\nSize: {size}px\nColor: {color}\n\nReason: {reason}',
                        {
                            position: positionText,
                            size: suggestion.fontSize,
                            color: suggestion.fontColor,
                            reason: suggestion.reason || t('dialog.text_overlay_window.default_suggestion_reason', 'The most suitable settings were selected based on visual analysis.')
                        }
                    );

                    document.getElementById('ai-response-section').style.display = 'block';
                    document.getElementById('ai-response').value = message;

                    // Analiz edilen kareyi göster
                    const previewContainer = document.getElementById('ai-preview-container');
                    if (previewContainer) {
                        previewContainer.innerHTML = `<img src="data:image/jpeg;base64,${frameData}" style="max-width: 100%; max-height: 150px; border-radius: 4px; border: 1px solid #444; margin-top: 10px;">`;
                        previewContainer.style.display = 'block';
                    }

                    // Canlı duyuru
                    const liveRegion = document.getElementById('ai-live-region');
                    liveRegion.textContent = '';
                    setTimeout(() => { liveRegion.textContent = message; }, 100);
                }

            } catch (error) {
                alert(t('dialog.text_overlay_window.suggestion_failed', 'Suggestion could not be received: {error}', { error: error.message }));
            } finally {
                document.getElementById('ai-loading').style.display = 'none';
                document.getElementById('ai-suggest-btn').disabled = false;
                document.getElementById('ai-feedback-btn').disabled = false;
            }
        }

        // AI geri bildirimi butonu
        document.getElementById('ai-feedback-btn').addEventListener('click', () => {
            conversationHistory = []; // Yeni konuşma başlat
            getAiFeedback();
        });

        // AI öneri butonu
        document.getElementById('ai-suggest-btn').addEventListener('click', () => {
            getAiStyleSuggestion();
        });

        // API anahtarını değiştir butonu
        document.getElementById('change-api-key-btn').addEventListener('click', () => {
            document.getElementById('api-key-section').style.display = 'block';
            document.getElementById('gemini-api-key').value = '';
            document.getElementById('gemini-api-key').focus();
        });

        // Takip sorusu sor
        document.getElementById('ask-followup-btn').addEventListener('click', () => {
            const question = document.getElementById('followup-question').value.trim();
            if (question) {
                getAiFeedback(question);
                document.getElementById('followup-question').value = '';
            }
        });

        // Enter ile takip sorusu gönder
        document.getElementById('followup-question').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('ask-followup-btn').click();
            }
        });

        // Sayfa yüklendiğinde
        initI18n();
        loadTtsVoices();

        // Main process'e hazır olduğumuzu bildir
        setTimeout(() => ipcRenderer.send('text-overlay-ready'), 100);
    </script>
</body>

</html>
