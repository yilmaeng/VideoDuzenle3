<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="dialog.slideshow_text_overlay.window_title">Add Text - Slideshow</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h2 {
            margin: 0 0 20px 0;
            color: #fff;
            border-bottom: 2px solid #0078d4;
            padding-bottom: 10px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #b0b0b0;
            font-weight: 500;
            font-size: 13px;
        }

        textarea,
        input[type="text"],
        select {
            width: 100%;
            padding: 10px;
            background: #252525;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        textarea:focus,
        input:focus,
        select:focus {
            outline: 2px solid #0078d4;
            border-color: #0078d4;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #252525;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }

        .checkbox-group label {
            margin: 0;
            color: #fff;
        }

        /* Resim seçimi */
        .image-selection {
            background: #252525;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .image-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .image-option:hover {
            background: #2d2d2d;
        }

        .image-option input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }

        .image-option-label {
            flex: 1;
            font-size: 13px;
        }

        .select-all-btn {
            background: #3d3d3d;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .select-all-btn:hover {
            background: #4d4d4d;
        }

        /* Önizleme */
        .preview-box {
            background: #0a0a0a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 20px;
            text-align: center;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-text {
            font-family: Arial, sans-serif;
            padding: 8px 16px;
        }

        /* Butonlar */
        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid #444;
            margin-top: auto;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        button:focus {
            outline: 2px solid #0078d4;
            outline-offset: 2px;
        }

        button.primary {
            background: #0078d4;
            color: white;
        }

        button.secondary {
            background: #444;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hint {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }

        /* Canlı duyuru */
        #live-region {
            position: absolute;
            left: -9999px;
        }

        .scroll-content {
            flex: 1;
            overflow-y: auto;
        }

        /* AI Bölümü */
        .ai-section {
            background: #1a2a3a;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            border: 1px solid #3a5a7a;
        }

        .ai-section h3 {
            margin: 0 0 15px 0;
            color: #7ab3ff;
            font-size: 14px;
        }

        .ai-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        #ai-response {
            width: 100%;
            background: #0a1520;
            color: #e0e0e0;
            border: 1px solid #3a5a7a;
            padding: 10px;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
            min-height: 100px;
        }

        .followup-section {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }

        .followup-section label {
            white-space: nowrap;
            font-size: 12px;
        }

        .followup-section input {
            flex: 1;
        }

        #ai-loading {
            color: #7ab3ff;
            font-style: italic;
            font-size: 13px;
        }

        #api-key-section {
            background: #252525;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div id="live-region" aria-live="assertive" aria-atomic="true"></div>

    <h2 data-i18n="dialog.slideshow_text_overlay.title_add">Add Text</h2>

    <div class="scroll-content">
        <!-- Yazı metni -->
        <div class="form-group">
            <label for="text-content" data-i18n="dialog.text_overlay_window.content">Text:</label>
            <textarea id="text-content" rows="3" placeholder="Eklenecek yazıyı girin..." data-i18n-placeholder="dialog.text_overlay_window.content_placeholder" autofocus></textarea>
        </div>

        <!-- Hangi resimlerde gösterilecek -->
        <div class="form-group">
            <label data-i18n="dialog.slideshow_text_overlay.target_images">Images to Show On</label>
            <button class="select-all-btn" id="select-all-btn" type="button" data-i18n="dialog.slideshow_text_overlay.select_all">Select All</button>
            <div class="image-selection" id="image-selection" role="group" aria-label="Resim seçimi" data-i18n-aria="dialog.slideshow_text_overlay.image_selection_aria">
                <p style="color: #666; font-size: 13px;" data-i18n="dialog.slideshow_text_overlay.loading_images">Loading image list...</p>
            </div>
            <p class="hint" data-i18n="dialog.slideshow_text_overlay.target_images_hint">Choose the images where this text should appear. You must select at least one image.</p>
        </div>

        <!-- Stil ayarları -->
        <div class="row">
            <div class="form-group">
                <label for="font-size" data-i18n="dialog.text_overlay_window.size">Size:</label>
                <select id="font-size">
                    <option value="24" data-i18n="dialog.slideshow_text_overlay.font_small">Small (24px)</option>
                    <option value="36" data-i18n="dialog.slideshow_text_overlay.font_medium">Medium (36px)</option>
                    <option value="48" selected data-i18n="dialog.slideshow_text_overlay.font_large">Large (48px)</option>
                    <option value="64" data-i18n="dialog.slideshow_text_overlay.font_xlarge">Very Large (64px)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="position" data-i18n="dialog.text_overlay_window.position">Position:</label>
                <select id="position">
                    <option value="top-left" data-i18n="dialog.text_overlay_window.pos_top_left">Top Left</option>
                    <option value="top-center" data-i18n="dialog.text_overlay_window.pos_top_center">Top Center</option>
                    <option value="top-right" data-i18n="dialog.text_overlay_window.pos_top_right">Top Right</option>
                    <option value="middle-left" data-i18n="dialog.text_overlay_window.pos_middle_left">Middle Left</option>
                    <option value="center" data-i18n="dialog.text_overlay_window.pos_center">Center</option>
                    <option value="middle-right" data-i18n="dialog.text_overlay_window.pos_middle_right">Middle Right</option>
                    <option value="bottom-left" data-i18n="dialog.text_overlay_window.pos_bottom_left">Bottom Left</option>
                    <option value="bottom-center" selected data-i18n="dialog.text_overlay_window.pos_bottom_center">Bottom Center</option>
                    <option value="bottom-right" data-i18n="dialog.text_overlay_window.pos_bottom_right">Bottom Right</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="font-color" data-i18n="dialog.text_overlay_window.color">Text Color:</label>
                <select id="font-color">
                    <option value="white" selected data-i18n="dialog.color.white">White</option>
                    <option value="black" data-i18n="dialog.color.black">Black</option>
                    <option value="yellow" data-i18n="dialog.color.yellow">Yellow</option>
                    <option value="red" data-i18n="dialog.color.red">Red</option>
                    <option value="blue" data-i18n="dialog.color.blue">Blue</option>
                    <option value="green" data-i18n="dialog.color.green">Green</option>
                </select>
            </div>
            <div class="form-group">
                <label for="background" data-i18n="dialog.text_overlay_window.background">Background:</label>
                <select id="background">
                    <option value="black" selected data-i18n="dialog.text_overlay_window.bg_black_transparent">Black (Semi-transparent)</option>
                    <option value="white" data-i18n="dialog.text_overlay_window.bg_white_transparent">White (Semi-transparent)</option>
                    <option value="none" data-i18n="dialog.text_overlay_window.bg_none">None (Transparent)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="shadow" data-i18n="dialog.text_overlay_window.shadow">Shadow:</label>
                <select id="shadow">
                    <option value="none" selected data-i18n="dialog.text_overlay_window.shadow_none">None</option>
                    <option value="small" data-i18n="dialog.text_overlay_window.shadow_small">Light</option>
                    <option value="medium" data-i18n="dialog.text_overlay_window.shadow_medium">Medium</option>
                    <option value="large" data-i18n="dialog.text_overlay_window.shadow_large">Strong</option>
                </select>
            </div>
        </div>

        <!-- Önizleme -->
        <div class="form-group">
            <label data-i18n="dialog.slideshow_text_overlay.preview">Preview</label>
            <div class="preview-box">
                <span id="preview-text" class="preview-text"
                    style="color: white; background: rgba(0,0,0,0.5); font-size: 48px;">
                    <span data-i18n="dialog.slideshow_text_overlay.sample_text">Sample Text</span>
                </span>
            </div>
        </div>

        <!-- Yapay Zeka Geri Bildirimi -->
        <div class="ai-section">
            <h3 data-i18n="dialog.text_overlay_window.ai_section">AI Feedback</h3>

            <!-- Model Seçimi -->
            <div class="form-group">
                <label for="gemini-model" data-i18n="dialog.text_overlay_window.gemini_model">Gemini Model:</label>
                <select id="gemini-model">
                    <option value="gemini-2.5-flash" selected data-i18n="dialog.text_overlay_window.model_flash">Gemini 2.5 Flash (Recommended)</option>
                    <option value="gemini-2.5-pro" data-i18n="dialog.text_overlay_window.model_pro">Gemini 2.5 Pro</option>
                    <option value="gemini-1.5-flash" data-i18n="dialog.text_overlay_window.model_flash_legacy">Gemini 1.5 Flash (Budget Friendly)</option>
                </select>
            </div>

            <!-- API Anahtarı (ilk kullanımda gösterilir) -->
            <div id="api-key-section" class="form-group" style="display: none;">
                <label for="gemini-api-key" data-i18n="dialog.text_overlay_window.api_key">Gemini API Key:</label>
                <input type="password" id="gemini-api-key" placeholder="API anahtarınızı girin" data-i18n-placeholder="dialog.text_overlay_window.api_key_placeholder">
                <div class="checkbox-group" style="margin-top: 5px;">
                    <input type="checkbox" id="save-api-key" checked>
                    <label for="save-api-key" data-i18n="dialog.text_overlay_window.save_api_key">Save this key</label>
                </div>
            </div>

            <!-- AI Butonları -->
            <div class="ai-buttons">
                <button type="button" id="ai-feedback-btn" class="secondary" data-i18n="dialog.text_overlay_window.ai_feedback">Comment on Current State</button>
                <button type="button" id="ai-suggest-btn" class="secondary" style="background-color: #2b5d2b;" data-i18n="dialog.text_overlay_window.ai_suggest">Suggest Style and Position</button>
                <button type="button" id="change-api-key-btn" class="secondary" style="font-size: 12px;" data-i18n="dialog.text_overlay_window.api_key_button">API Key</button>
            </div>

            <!-- AI Yanıt Alanı -->
            <div id="ai-response-section" class="form-group" style="display: none;">
                <label for="ai-response" data-i18n="dialog.text_overlay_window.ai_response">AI Response:</label>
                <!-- Analiz edilen görüntü önizlemesi -->
                <div id="ai-preview-container" style="display: none; margin-bottom: 10px; text-align: center;"></div>
                <textarea id="ai-response" readonly rows="5"></textarea>
                <!-- Ekran okuyucu için canlı duyuru alanı -->
                <div id="ai-live-region" aria-live="assertive" aria-atomic="true"
                    style="position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden;"></div>

                <!-- Takip Sorusu -->
                <div class="followup-section">
                    <label for="followup-question" data-i18n="dialog.text_overlay_window.followup">Ask a Follow-up:</label>
                    <input type="text" id="followup-question" placeholder="Sorunuzu yazın..." data-i18n-placeholder="dialog.text_overlay_window.followup_placeholder">
                    <button type="button" id="ask-followup-btn" class="secondary"
                        style="padding: 8px 12px;" data-i18n="dialog.text_overlay_window.ask">Ask</button>
                </div>
            </div>

            <!-- Yükleniyor göstergesi -->
            <div id="ai-loading" style="display: none;">
                <p data-i18n="dialog.text_overlay_window.ai_loading">Waiting for AI response...</p>
            </div>
        </div>
    </div>

    <div class="buttons">
        <button class="secondary" id="cancel-btn" data-i18n="dialog.cancel">Cancel</button>
        <button class="primary" id="add-btn" disabled data-i18n="dialog.text_overlay_window.add_to_list">Add to List</button>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        let currentLang = 'tr';
        let i18nCache = {};

        function getPathValue(obj, key) {
            return key.split('.').reduce((acc, part) => (acc && acc[part] !== undefined ? acc[part] : null), obj);
        }

        function t(key, fallback = key, params = {}) {
            const template = getPathValue(i18nCache, key) ?? fallback;
            return Object.entries(params).reduce((text, [name, value]) => (
                String(text).replace(new RegExp(`{${name}}`, 'g'), value)
            ), template);
        }

        function translateDocument(root = document) {
            const textEls = Array.from((root === document ? document : root).querySelectorAll?.('[data-i18n]') || []);
            if (root !== document && root?.hasAttribute?.('data-i18n')) textEls.unshift(root);
            textEls.forEach((el) => {
                const value = t(el.getAttribute('data-i18n'), null);
                if (value) el.textContent = value;
            });
            const placeholderEls = Array.from((root === document ? document : root).querySelectorAll?.('[data-i18n-placeholder]') || []);
            if (root !== document && root?.hasAttribute?.('data-i18n-placeholder')) placeholderEls.unshift(root);
            placeholderEls.forEach((el) => {
                const value = t(el.getAttribute('data-i18n-placeholder'), null);
                if (value) el.setAttribute('placeholder', value);
            });
            const ariaEls = Array.from((root === document ? document : root).querySelectorAll?.('[data-i18n-aria]') || []);
            if (root !== document && root?.hasAttribute?.('data-i18n-aria')) ariaEls.unshift(root);
            ariaEls.forEach((el) => {
                const value = t(el.getAttribute('data-i18n-aria'), null);
                if (value) el.setAttribute('aria-label', value);
            });
            const titleEl = document.querySelector('title[data-i18n]');
            if (titleEl) {
                const value = t(titleEl.getAttribute('data-i18n'), null);
                if (value) document.title = value;
            }
            document.documentElement.lang = currentLang;
        }

        async function initI18n() {
            currentLang = await ipcRenderer.invoke('i18n-get-language');
            i18nCache = await ipcRenderer.invoke('i18n-get-all');
            translateDocument();
            ipcRenderer.on('language-changed', async (_event, lang) => {
                currentLang = lang;
                i18nCache = await ipcRenderer.invoke('i18n-get-all');
                translateDocument();
                updatePreview();
            });
        }

        function getCurrentAiLanguageName() {
            const names = { tr: 'Turkish', en: 'English', de: 'German', es: 'Spanish', fr: 'French' };
            return names[currentLang] || 'English';
        }

        function getAiSystemInstruction(mode = 'default') {
            const lang = getCurrentAiLanguageName();
            return mode === 'json'
                ? `Respond only in ${lang}. If JSON output is requested, keep all JSON keys and schema exactly as requested while writing any free text values in ${lang}.`
                : `Respond only in ${lang}. Keep the same response language in follow-up answers.`;
        }

        // DOM elemanları
        const textContent = document.getElementById('text-content');
        const imageSelection = document.getElementById('image-selection');
        const selectAllBtn = document.getElementById('select-all-btn');
        const fontSize = document.getElementById('font-size');
        const position = document.getElementById('position');
        const fontColor = document.getElementById('font-color');
        const background = document.getElementById('background');
        const shadow = document.getElementById('shadow');
        const previewText = document.getElementById('preview-text');
        const addBtn = document.getElementById('add-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const liveRegion = document.getElementById('live-region');

        let imageList = [];

        // Ekran okuyucu duyurusu
        function announce(message) {
            liveRegion.textContent = '';
            setTimeout(() => {
                liveRegion.textContent = message;
            }, 100);
        }

        // Resim listesini render et
        function renderImageSelection() {
            if (imageList.length === 0) {
                imageSelection.innerHTML = `<p style="color: #888; font-size: 13px;">${t('dialog.slideshow_text_overlay.no_images', 'No images have been added yet.')}</p>`;
                return;
            }

            imageSelection.innerHTML = imageList.map((img, index) => `
                <label class="image-option">
                    <input type="checkbox" value="${img.id}" data-index="${index}">
                    <span class="image-option-label">${index + 1}. ${img.shortDescription || img.filename}</span>
                </label>
            `).join('');
        }

        let editMode = false;
        let editIndex = -1;

        // Başlangıç verileri
        ipcRenderer.on('slideshow-text-init', (event, data) => {
            console.log('slideshow-text-init alındı:', data);

            if (data && data.images && data.images.length > 0) {
                imageList = data.images;
                renderImageSelection();

                // Başlangıç seçimi kontrolü
                if (data.imageIds && data.imageIds.length > 0) {
                    setTimeout(() => {
                        const checkboxes = imageSelection.querySelectorAll('input[type="checkbox"]');
                        checkboxes.forEach(cb => {
                            if (data.imageIds.includes(cb.value)) {
                                cb.checked = true;
                                validateForm();
                            }
                        });
                    }, 100);
                }

                // Düzenleme modu kontrolü
                if (data.editText) {
                    editMode = true;
                    editIndex = data.editIndex;
                    const editText = data.editText;

                    // Form alanlarını doldur
                    textContent.value = editText.content;
                    fontSize.value = editText.fontSize || 48;
                    // Form alanlarını doldur
                    textContent.value = editText.content;
                    fontSize.value = editText.fontSize || 48;

                    // Eski konum değerlerini dönüştür
                    let pos = editText.position || 'bottom-center';
                    if (pos === 'top') pos = 'top-center';
                    if (pos === 'bottom') pos = 'bottom-center';
                    position.value = pos;

                    fontColor.value = editText.fontColor || 'white';
                    fontColor.value = editText.fontColor || 'white';
                    background.value = editText.background || 'black';
                    shadow.value = editText.shadow || 'none';

                    // Seçili resimleri işaretle
                    setTimeout(() => {
                        const checkboxes = imageSelection.querySelectorAll('input[type="checkbox"]');
                        checkboxes.forEach(cb => {
                            if (editText.targetImages.includes(cb.value)) {
                                cb.checked = true;
                            }
                        });
                    }, 100);

                    addBtn.textContent = t('dialog.text_overlay_window.update', 'Update');
                    addBtn.disabled = false;
                    document.querySelector('h2').textContent = t('dialog.slideshow_text_overlay.title_edit', 'Edit Text');
                    updatePreview();

                    announce(t('runtime.slideshow_text_overlay.edit_opened', 'Text edit dialog opened. {count} images are available.', {
                        count: imageList.length
                    }));
                } else {
                    announce(t('runtime.slideshow_text_overlay.add_opened_with_images', 'Text add dialog opened. {count} images are available. Enter the text content.', {
                        count: imageList.length
                    }));
                }
            } else {
                imageSelection.innerHTML = `<p style="color: #888; font-size: 13px;">${t('dialog.slideshow_text_overlay.no_images', 'No images have been added yet.')}</p>`;
                announce(t('runtime.slideshow_text_overlay.add_opened', 'Text add dialog opened. Enter the text content.'));
            }
            textContent.focus();
        });

        // Metin ve resim seçimi kontrolü
        function validateForm() {
            const hasText = textContent.value.trim() !== '';
            const hasSelection = imageSelection.querySelectorAll('input[type="checkbox"]:checked').length > 0;
            addBtn.disabled = !(hasText && hasSelection);
        }

        // Metin değiştiğinde buton durumunu güncelle
        textContent.addEventListener('input', () => {
            validateForm();
            updatePreview();
        });

        // Resim seçimi değiştiğinde kontrol et
        imageSelection.addEventListener('change', validateForm);

        // Önizleme güncelle
        function updatePreview() {
            const text = textContent.value.trim() || t('dialog.slideshow_text_overlay.sample_text', 'Sample Text');
            // Yeni satırları <br> etiketine çevirerek önizlemede doğru görünmesini sağla
            previewText.innerHTML = text.replace(/\n/g, '<br>');
            previewText.style.fontSize = fontSize.value + 'px';
            previewText.style.color = fontColor.value;

            if (background.value === 'black') {
                previewText.style.background = 'rgba(0,0,0,0.5)';
            } else if (background.value === 'white') {
                previewText.style.background = 'rgba(255,255,255,0.5)';
            } else {
                previewText.style.background = 'none';
            }

            // Gölge önizleme
            const sVal = shadow.value;
            if (sVal === 'small') previewText.style.textShadow = '2px 2px 2px rgba(0,0,0,0.8)';
            else if (sVal === 'medium') previewText.style.textShadow = '4px 4px 4px rgba(0,0,0,0.8)';
            else if (sVal === 'large') previewText.style.textShadow = '6px 6px 6px rgba(0,0,0,0.8)';
            else previewText.style.textShadow = 'none';
        }

        fontSize.addEventListener('change', updatePreview);
        fontColor.addEventListener('change', updatePreview);
        background.addEventListener('change', updatePreview);
        shadow.addEventListener('change', updatePreview);

        // Tümünü seç
        selectAllBtn.addEventListener('click', () => {
            const checkboxes = imageSelection.querySelectorAll('input[type="checkbox"]');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);

            checkboxes.forEach(cb => {
                cb.checked = !allChecked;
            });

            selectAllBtn.textContent = allChecked
                ? t('dialog.slideshow_text_overlay.select_all', 'Select All')
                : t('dialog.slideshow_text_overlay.clear_all', 'Clear All');
            validateForm(); // Buton durumunu güncelle
            announce(allChecked
                ? t('runtime.slideshow_text_overlay.all_cleared', 'All selections were cleared.')
                : t('runtime.slideshow_text_overlay.all_selected', 'All images were selected.'));
        });

        // Ekle/Güncelle
        addBtn.addEventListener('click', () => {
            const selectedCheckboxes = imageSelection.querySelectorAll('input[type="checkbox"]:checked');
            const selectedImageIds = Array.from(selectedCheckboxes).map(cb => cb.value);

            const textData = {
                id: editMode ? undefined : `text_${Date.now()}`,
                content: textContent.value.trim(),
                targetImages: selectedImageIds,
                fontSize: parseInt(fontSize.value),
                position: position.value,
                fontColor: fontColor.value,
                background: background.value,
                shadow: shadow.value
            };

            if (editMode) {
                ipcRenderer.send('slideshow-text-updated', { editIndex, textData });
            } else {
                ipcRenderer.send('slideshow-text-added', textData);
            }
            window.close();
        });

        // İptal
        cancelBtn.addEventListener('click', () => {
            window.close();
        });

        // ESC ile kapat
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.close();
            }
        });

        // Sayfa yüklendiğinde
        window.addEventListener('load', () => {
            initI18n();
            announce(t('runtime.slideshow_text_overlay.add_opened_short', 'Text add dialog opened.'));
        });

        // === YAPAY ZEKA GERİ BİLDİRİMİ ===
        let conversationHistory = [];

        // API anahtarını kontrol et
        async function checkApiKey() {
            const savedKey = await ipcRenderer.invoke('get-gemini-api-key');
            if (savedKey) {
                return savedKey;
            }
            // API anahtarı yok, kullanıcıdan iste
            document.getElementById('api-key-section').style.display = 'block';
            document.getElementById('gemini-api-key').focus();
            return null;
        }

        // Form verilerini topla
        function collectFormData() {
            return {
                text: textContent.value.trim(),
                fontSize: parseInt(fontSize.value),
                position: position.value,
                fontColor: fontColor.value,
                background: background.value,
                shadow: shadow.value
            };
        }

        // Seçili resim yollarını al
        function getSelectedImagePaths() {
            const selectedCheckboxes = imageSelection.querySelectorAll('input[type="checkbox"]:checked');
            const selectedIds = Array.from(selectedCheckboxes).map(cb => cb.value);

            // Eğer seçim yoksa tüm resimler seçili
            const targetIds = selectedIds.length > 0 ? selectedIds : imageList.map(img => img.id);

            return imageList
                .filter(img => targetIds.includes(img.id))
                .map(img => img.path);
        }

        // AI geri bildirimi al
        async function getAiFeedback(customPrompt = null) {
            const formData = collectFormData();
            if (!formData.text) {
                alert(t('dialog.text_overlay_window.enter_text_first', 'Please enter text first.'));
                textContent.focus();
                return;
            }

            const selectedImages = getSelectedImagePaths();
            if (selectedImages.length === 0) {
                alert(t('dialog.slideshow_text_overlay.select_image_first', 'Please select at least one image or add images.'));
                return;
            }

            // API anahtarını kontrol et
            let apiKey = await checkApiKey();
            if (!apiKey) {
                const keyInput = document.getElementById('gemini-api-key');
                if (!keyInput.value.trim()) {
                    alert(t('dialog.text_overlay_window.enter_api_key', 'Please enter your Gemini API key.'));
                    keyInput.focus();
                    return;
                }
                apiKey = keyInput.value.trim();

                // Kaydetme seçeneği
                if (document.getElementById('save-api-key').checked) {
                    await ipcRenderer.invoke('save-gemini-api-key', apiKey);
                }
                document.getElementById('api-key-section').style.display = 'none';
            }

            // Yükleniyor göster
            document.getElementById('ai-loading').style.display = 'block';
            document.getElementById('ai-feedback-btn').disabled = true;
            announce(t('dialog.text_overlay_window.ai_loading', 'Waiting for AI response...'));

            try {
                // İlk seçili resmi base64'e çevir
                const firstImagePath = selectedImages[0];
                const imageBase64 = await ipcRenderer.invoke('get-image-base64', firstImagePath);

                // Prompt hazırla
                const aiLang = getCurrentAiLanguageName();
                const defaultPrompt = currentLang === 'tr'
                    ? `Görme engelli bir kullanıcıyım ve slideshow videoma bir yazı ekledim.

Yazı bilgileri:
- Metin: "${formData.text.replace(/\n/g, '\\n')}" (Not: \\n kısımları kullanıcının metni satırlara böldüğü yerlerdir)
- Boyut: ${formData.fontSize}px
- Yazı rengi: ${formData.fontColor}
- Arka plan: ${formData.background}
- Konum: ${formData.position}

Bu yazıyı ${selectedImages.length} resimde göstereceğim. Sana bunlardan birini paylaştım.

Bana resmi kısaca betimle. Sonrasında eklediğim yazının boyutu, konumu ve uzunluğu bakımından bu görsele uygun olup olmadığını analiz et. Ekrana tam sığıyor mu, dışarı taşıyor mu, okunabilir mi bunları net şekilde açıkla. Gerekirse daha okunaklı olması için öneriler ver.

Yanıtının tamamını yalnızca Türkçe ver.`
                    : `I am a blind user and I added a text overlay to my slideshow video.

Text settings:
- Text: "${formData.text.replace(/\n/g, '\\n')}" (Note: \\n shows where the user split the text into lines)
- Size: ${formData.fontSize}px
- Text color: ${formData.fontColor}
- Background: ${formData.background}
- Position: ${formData.position}

I will show this text on ${selectedImages.length} images. I shared one of them with you.

Briefly describe the image where I placed the text. Then analyze whether the text size, position, and length fit that image well. Clearly explain whether it fully fits on screen, overflows, and stays readable. If needed, suggest improvements for better readability.

Write the full answer only in ${aiLang}.`;

                const prompt = customPrompt || defaultPrompt;

                // Takip sorusuysa güncel form bilgilerini de ekle
                const finalPrompt = customPrompt
                    ? (currentLang === 'tr'
                        ? `Güncel yazı ayarları:
- Metin: "${formData.text.replace(/\n/g, '\\n')}" (Not: \\n kısımları kullanıcının metni satırlara böldüğü yerlerdir)
- Boyut: ${formData.fontSize}px
- Yazı rengi: ${formData.fontColor}
- Arka plan: ${formData.background}
- Konum: ${formData.position}

(ÖNEMLİ: Yanıt verirken bu güncel ayarlarla metnin ekrana tam sığıp sığmadığını ve taşıp taşmadığını da her zaman analiz ederek görüşünü belirt.)

Kullanıcının ek sorusu: ${customPrompt}`
                        : `Current text settings:
- Text: "${formData.text.replace(/\n/g, '\\n')}" (Note: \\n shows where the user split the text into lines)
- Size: ${formData.fontSize}px
- Text color: ${formData.fontColor}
- Background: ${formData.background}
- Position: ${formData.position}

Important: always evaluate whether the text fully fits on screen with these current settings and whether it overflows.

User follow-up question: ${customPrompt}

Write the full answer only in ${aiLang}.`)
                    : prompt;

                // Konuşma geçmişine ekle
                conversationHistory.push({ role: 'user', content: finalPrompt });

                // Seçilen modeli al
                const selectedModel = document.getElementById('gemini-model').value;

                // Gemini'ye gönder
                const result = await ipcRenderer.invoke('gemini-vision-request', {
                    apiKey,
                    model: selectedModel,
                    imageBase64: imageBase64,
                    prompt: finalPrompt,
                    history: conversationHistory.slice(0, -1),
                    systemInstruction: getAiSystemInstruction()
                });

                if (!result.success) {
                    throw new Error(result.error || t('runtime.slideshow_text_overlay.unknown_error', 'Unknown error'));
                }

                const response = result.text;

                // Yanıtı göster
                document.getElementById('ai-response-section').style.display = 'block';
                const responseArea = document.getElementById('ai-response');
                responseArea.value = response;

                // Konuşma geçmişine ekle
                conversationHistory.push({ role: 'assistant', content: response });

                // Ekran okuyucu için otomatik oku
                const liveRegion = document.getElementById('ai-live-region');
                liveRegion.textContent = '';
                setTimeout(() => {
                    liveRegion.textContent = t('dialog.text_overlay_window.ai_response_announce', 'AI response: {response}', { response });
                }, 100);

                // Yanıt alanına odaklan
                responseArea.focus();

            } catch (error) {
                alert(t('dialog.text_overlay_window.ai_error', 'AI error: {error}', { error: error.message }));
                announce(t('dialog.text_overlay_window.ai_error', 'AI error: {error}', { error: error.message }));
            } finally {
                document.getElementById('ai-loading').style.display = 'none';
                document.getElementById('ai-feedback-btn').disabled = false;
            }
        }

        // AI geri bildirimi butonu
        // AI stil önerisi al
        async function getAiStyleSuggestion() {
            const formData = collectFormData();
            if (!formData.text) {
                alert(t('dialog.text_overlay_window.enter_text_first', 'Please enter text first.'));
                textContent.focus();
                return;
            }

            const selectedImages = getSelectedImagePaths();
            if (selectedImages.length === 0) {
                alert(t('dialog.slideshow_text_overlay.select_image_first', 'Please select at least one image or add images.'));
                return;
            }

            // API anahtarını kontrol et
            let apiKey = await checkApiKey();
            if (!apiKey) {
                const keyInput = document.getElementById('gemini-api-key');
                if (!keyInput.value.trim()) {
                    alert(t('dialog.text_overlay_window.enter_api_key', 'Please enter your Gemini API key.'));
                    keyInput.focus();
                    return;
                }
                apiKey = keyInput.value.trim();
                if (document.getElementById('save-api-key').checked) {
                    await ipcRenderer.invoke('save-gemini-api-key', apiKey);
                }
                document.getElementById('api-key-section').style.display = 'none';
            }

            // Yükleniyor
            document.getElementById('ai-loading').style.display = 'block';
            document.getElementById('ai-suggest-btn').disabled = true;
            document.getElementById('ai-feedback-btn').disabled = true;
            announce(t('runtime.slideshow_text_overlay.ai_suggestion_loading', 'AI suggestion is being generated...'));

            try {
                // İlk seçili resmi base64'e çevir
                const firstImagePath = selectedImages[0];
                const imageBase64 = await ipcRenderer.invoke('get-image-base64', firstImagePath);

                // Prompt
                const aiLang = getCurrentAiLanguageName();
                const prompt = currentLang === 'tr'
                    ? `Görüntüyü ve şu metni analiz et: "${formData.text.replace(/\n/g, '\\n')}" (Not: \\n kısımları kullanıcının metni satırlara böldüğü yerlerdir).
Metnin bu görsel üzerinde en okunaklı, estetik ve görsel olarak uygun şekilde konumlandırılması ve biçimlendirilmesi için önerilerde bulun.
Yazının arka planda yeterince görünür ve okunabilir olup olmayacağını özellikle değerlendir.

Yanıtı SADECE aşağıdaki JSON formatında döndür:
{
  "position": "top-left, top-center, top-right, middle-left, center, middle-right, bottom-left, bottom-center, bottom-right",
  "fontSize": 24 | 36 | 48 | 64,
  "fontColor": "white | black | yellow | red | blue | green",
  "backgroundColor": "none | black | white",
  "shadow": "none | small | medium | large",
  "reason": "kısa açıklama"
}`
                    : `Analyze the image and this text: "${formData.text.replace(/\n/g, '\\n')}" (Note: \\n shows where the user split the text into lines).
Suggest the most readable, aesthetic, and visually appropriate placement and styling for the text on this image.
Pay special attention to whether the text will stay visible and readable against the background.

Return ONLY this JSON format:
{
  "position": "top-left, top-center, top-right, middle-left, center, middle-right, bottom-left, bottom-center, bottom-right",
  "fontSize": 24 | 36 | 48 | 64,
  "fontColor": "white | black | yellow | red | blue | green",
  "backgroundColor": "none | black | white",
  "shadow": "none | small | medium | large",
  "reason": "short explanation in ${aiLang}"
}`;

                const selectedModel = document.getElementById('gemini-model').value;

                const result = await ipcRenderer.invoke('gemini-vision-request', {
                    apiKey,
                    model: selectedModel,
                    imageBase64: imageBase64,
                    prompt: prompt,
                    history: [],
                    systemInstruction: getAiSystemInstruction('json')
                });

                if (!result.success) {
                    throw new Error(result.error);
                }

                // JSON'ı parse etmeye çalış
                let suggestion;
                try {
                    let cleanedText = result.text.replace(/```json/g, '').replace(/```/g, '').trim();
                    suggestion = JSON.parse(cleanedText);
                } catch (e) {
                    console.error('JSON parse error:', e);
                    throw new Error(t('runtime.slideshow_text_overlay.invalid_json', 'AI did not return a valid format. Please try again.'));
                }

                // Önerileri uygula
                // Önerileri uygula
                if (suggestion) {
                    if (suggestion.position) position.value = suggestion.position;
                    if (suggestion.fontSize) fontSize.value = String(suggestion.fontSize);
                    if (suggestion.fontColor) fontColor.value = suggestion.fontColor;
                    if (suggestion.backgroundColor) background.value = suggestion.backgroundColor;
                    if (suggestion.shadow) shadow.value = suggestion.shadow;

                    updatePreview();

                    const message = t('runtime.slideshow_text_overlay.suggestion_applied', 'Suggestion applied:\nPosition: {position}\nSize: {size}px\nColor: {color}\nBackground: {background}\nShadow: {shadow}\n\nReason: {reason}', {
                        position: suggestion.position,
                        size: suggestion.fontSize,
                        color: suggestion.fontColor,
                        background: suggestion.backgroundColor,
                        shadow: suggestion.shadow || t('dialog.text_overlay_window.shadow_none', 'None'),
                        reason: suggestion.reason || t('dialog.text_overlay_window.default_suggestion_reason', 'The most suitable settings were selected based on visual analysis.')
                    });

                    document.getElementById('ai-response-section').style.display = 'block';
                    document.getElementById('ai-response').value = message;

                    // Analiz edilen kareyi göster
                    const previewContainer = document.getElementById('ai-preview-container');
                    if (previewContainer) {
                        previewContainer.innerHTML = `<img src="data:image/jpeg;base64,${imageBase64}" style="max-width: 100%; max-height: 150px; border-radius: 4px; border: 1px solid #444; margin-top: 10px;">`;
                        previewContainer.style.display = 'block';
                    }

                    announce(message);
                }

            } catch (error) {
                alert(t('dialog.text_overlay_window.suggestion_failed', 'Suggestion could not be received: {error}', { error: error.message }));
                announce(t('dialog.text_overlay_window.ai_error', 'AI error: {error}', { error: error.message }));
            } finally {
                document.getElementById('ai-loading').style.display = 'none';
                document.getElementById('ai-suggest-btn').disabled = false;
                document.getElementById('ai-feedback-btn').disabled = false;
            }
        }

        // AI geri bildirimi butonu
        document.getElementById('ai-feedback-btn').addEventListener('click', () => {
            conversationHistory = []; // Yeni konuşma başlat
            getAiFeedback();
        });

        // AI öneri butonu
        document.getElementById('ai-suggest-btn').addEventListener('click', () => {
            getAiStyleSuggestion();
        });

        // API anahtarını değiştir butonu
        document.getElementById('change-api-key-btn').addEventListener('click', () => {
            document.getElementById('api-key-section').style.display = 'block';
            document.getElementById('gemini-api-key').value = '';
            document.getElementById('gemini-api-key').focus();
        });

        // Takip sorusu sor
        document.getElementById('ask-followup-btn').addEventListener('click', () => {
            const question = document.getElementById('followup-question').value.trim();
            if (question) {
                getAiFeedback(question);
                document.getElementById('followup-question').value = '';
            }
        });

        // Enter ile takip sorusu gönder
        document.getElementById('followup-question').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('ask-followup-btn').click();
            }
        });
    </script>
