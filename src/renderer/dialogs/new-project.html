<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="dialog.new_project.window_title">Create New Project</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }

        h2 {
            margin-top: 0;
            color: #fff;
            border-bottom: 2px solid #0078d4;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
            font-weight: 500;
        }

        .radio-group {
            background: #252525;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #444;
        }

        .radio-option {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .radio-option:hover {
            background: #2d2d2d;
        }

        .radio-option:last-child {
            margin-bottom: 0;
        }

        .radio-option input[type="radio"] {
            margin-right: 12px;
            margin-top: 3px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .radio-option input[type="radio"]:focus {
            outline: 2px solid #0078d4;
            outline-offset: 2px;
        }

        .radio-label {
            flex: 1;
        }

        .radio-label strong {
            display: block;
            color: #fff;
            margin-bottom: 4px;
            font-size: 15px;
        }

        .radio-label span {
            color: #888;
            font-size: 13px;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            background: #1a2a3a;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #3a5a7a;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 12px;
            margin-top: 3px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"]:focus {
            outline: 2px solid #0078d4;
            outline-offset: 2px;
        }

        .checkbox-label {
            flex: 1;
        }

        .checkbox-label strong {
            display: block;
            color: #7ab3ff;
            margin-bottom: 4px;
        }

        .checkbox-label span {
            color: #888;
            font-size: 13px;
        }

        .section-title {
            font-size: 14px;
            color: #7ab3ff;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
            padding: 10px;
            background: #252525;
            border-radius: 4px;
            border-left: 3px solid #0078d4;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #444;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        button:focus {
            outline: 2px solid #0078d4;
            outline-offset: 2px;
        }

        button.primary {
            background: #0078d4;
            color: white;
        }

        button.secondary {
            background: #444;
            color: #fff;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Görünmez ama ekran okuyucu için okunabilir alan */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Canlı duyuru bölgesi */
        #live-region {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="live-region" aria-live="assertive" aria-atomic="true"></div>

    <h2 data-i18n="dialog.new_project.title">Create New Project</h2>

    <form id="new-project-form">
        <!-- Proje Türü (şimdilik sadece slideshow) -->
        <div class="form-group">
            <div class="section-title" data-i18n="dialog.new_project.project_type">Project Type</div>
            <div class="radio-group" role="radiogroup" aria-labelledby="project-type-label">
                <span id="project-type-label" class="sr-only" data-i18n="dialog.new_project.project_type_sr">Project type selection</span>
                <label class="radio-option">
                    <input type="radio" name="project-type" value="slideshow" checked aria-describedby="slideshow-desc">
                    <div class="radio-label">
                        <strong data-i18n="dialog.new_project.slideshow_title">Slideshow Project (Images + Audio)</strong>
                        <span id="slideshow-desc" data-i18n="dialog.new_project.slideshow_desc">Create a video by combining image and audio or music files.</span>
                    </div>
                </label>
            </div>
        </div>

        <!-- Video Çıktı Oranı -->
        <div class="form-group">
            <div class="section-title" data-i18n="dialog.new_project.aspect_ratio">Video Output Aspect Ratio</div>
            <div class="radio-group" role="radiogroup" aria-labelledby="aspect-ratio-label">
                <span id="aspect-ratio-label" class="sr-only" data-i18n="dialog.new_project.aspect_ratio_sr">Video aspect ratio selection</span>

                <label class="radio-option">
                    <input type="radio" name="aspect-ratio" value="16:9" checked aria-describedby="ratio-16-9-desc">
                    <div class="radio-label">
                        <strong data-i18n="dialog.new_project.ratio_16_9">16:9 - Landscape</strong>
                        <span id="ratio-16-9-desc" data-i18n="dialog.new_project.ratio_16_9_desc">Recommended for YouTube and traditional videos</span>
                    </div>
                </label>

                <label class="radio-option">
                    <input type="radio" name="aspect-ratio" value="9:16" aria-describedby="ratio-9-16-desc">
                    <div class="radio-label">
                        <strong data-i18n="dialog.new_project.ratio_9_16">9:16 - Portrait</strong>
                        <span id="ratio-9-16-desc" data-i18n="dialog.new_project.ratio_9_16_desc">Recommended for TikTok, Instagram Reels, and YouTube Shorts</span>
                    </div>
                </label>
            </div>
            <div class="hint" role="note">
                <strong data-i18n="dialog.new_project.note_label">Note:</strong> <span data-i18n="dialog.new_project.note_text">Please choose an aspect ratio. This determines how the images you add will be positioned.</span>
            </div>
        </div>

        <!-- Görsel Yerleşim Varsayılanı -->
        <div class="form-group">
            <div class="section-title" data-i18n="dialog.new_project.fill_frame_section">Visual Layout Setting</div>
            <div class="radio-group" role="radiogroup" aria-labelledby="visual-fit-label">
                <span id="visual-fit-label" class="sr-only" data-i18n="dialog.new_project.visual_fit_sr">Visual fit behavior</span>

                <label class="radio-option">
                    <input type="radio" name="visual-fit-mode" value="blur" checked aria-describedby="fit-blur-desc">
                    <div class="radio-label">
                        <strong data-i18n="dialog.new_project.fit_blur_title">Show full visual with blurred background</strong>
                        <span id="fit-blur-desc" data-i18n="dialog.new_project.fit_blur_desc">Recommended. The full photo or video remains visible and empty areas are filled with a blurred background.</span>
                    </div>
                </label>

                <label class="radio-option">
                    <input type="radio" name="visual-fit-mode" value="crop" aria-describedby="fit-crop-desc">
                    <div class="radio-label">
                        <strong data-i18n="dialog.new_project.fit_crop_title">Crop if needed and fill the frame</strong>
                        <span id="fit-crop-desc" data-i18n="dialog.new_project.fit_crop_desc">The frame is fully filled, but edges may be cropped when the media aspect ratio is different.</span>
                    </div>
                </label>

                <label class="radio-option">
                    <input type="radio" name="visual-fit-mode" value="fit" aria-describedby="fit-contain-desc">
                    <div class="radio-label">
                        <strong data-i18n="dialog.new_project.fit_contain_title">Fit inside the frame and leave empty space</strong>
                        <span id="fit-contain-desc" data-i18n="dialog.new_project.fit_contain_desc">The full visual is preserved and empty areas stay black if needed.</span>
                    </div>
                </label>
            </div>
        </div>

        <div class="buttons">
            <button type="button" class="secondary" id="cancel-btn" data-i18n="dialog.cancel">Cancel</button>
            <button type="submit" class="primary" id="create-btn" data-i18n="dialog.new_project.create">Create Project</button>
        </div>
    </form>

    <script>
        const { ipcRenderer } = require('electron');
        let i18nState = { lang: 'tr', cache: {} };

        function getValue(obj, key) {
            return key.split('.').reduce((acc, part) => (acc && acc[part] !== undefined ? acc[part] : null), obj);
        }

        function t(key, fallback = key, params = {}) {
            const template = getValue(i18nState.cache, key) ?? fallback;
            return Object.entries(params).reduce((text, [name, value]) => (
                String(text).replace(new RegExp(`{${name}}`, 'g'), value)
            ), template);
        }

        function translateDOM(root = document) {
            const scope = root && root.querySelectorAll ? root : document;
            const textEls = [];
            if (root !== document && root?.hasAttribute?.('data-i18n')) textEls.push(root);
            textEls.push(...scope.querySelectorAll('[data-i18n]'));
            textEls.forEach((el) => {
                const value = t(el.getAttribute('data-i18n'), null);
                if (value) el.textContent = value;
            });
            const titleEl = document.querySelector('title[data-i18n]');
            if (titleEl) {
                const value = t(titleEl.getAttribute('data-i18n'), null);
                if (value) document.title = value;
            }
            document.documentElement.lang = i18nState.lang;
        }

        async function initI18n() {
            try {
                i18nState.lang = await ipcRenderer.invoke('i18n-get-language');
                i18nState.cache = await ipcRenderer.invoke('i18n-get-all');
                translateDOM();
                ipcRenderer.on('language-changed', async (_event, lang) => {
                    i18nState.lang = lang;
                    i18nState.cache = await ipcRenderer.invoke('i18n-get-all');
                    translateDOM();
                });
            } catch (error) {
                console.warn('New project i18n init failed:', error);
            }
        }

        // Form elemanları
        const form = document.getElementById('new-project-form');
        const aspectRatioInputs = document.querySelectorAll('input[name="aspect-ratio"]');
        const visualFitInputs = document.querySelectorAll('input[name="visual-fit-mode"]');
        const createBtn = document.getElementById('create-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const liveRegion = document.getElementById('live-region');

        // Ekran okuyucu için duyuru
        function announce(message) {
            liveRegion.textContent = '';
            setTimeout(() => {
                liveRegion.textContent = message;
            }, 100);
        }

        // Oran seçildiğinde oluştur butonunu aktif et
        aspectRatioInputs.forEach(input => {
            input.addEventListener('change', () => {
                createBtn.disabled = false;
                const label = input.value === '16:9'
                    ? t('dialog.new_project.ratio_16_9_spoken', 'Landscape 16:9')
                    : t('dialog.new_project.ratio_9_16_spoken', 'Portrait 9:16');
                announce(t('runtime.new_project.ratio_selected', '{label} selected. Press Create Project to continue.', { label }));
            });
        });

        visualFitInputs.forEach(input => {
            input.addEventListener('change', () => {
                const label = input.value === 'crop'
                    ? t('dialog.new_project.fit_crop_spoken', 'crop and fill')
                    : (input.value === 'fit'
                        ? t('dialog.new_project.fit_contain_spoken', 'fit with empty space')
                        : t('dialog.new_project.fit_blur_spoken', 'full visual with blurred background'));
                announce(t('runtime.new_project.visual_fit_selected', '{label} selected.', { label }));
            });
        });

        // Form gönderimi
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            console.log('Form submit edildi');

            const selectedRatio = document.querySelector('input[name="aspect-ratio"]:checked');
            if (!selectedRatio) {
                announce(t('runtime.new_project.select_ratio_first', 'Please select a video output aspect ratio.'));
                aspectRatioInputs[0].focus();
                return;
            }

            const projectSettings = {
                type: 'slideshow',
                aspectRatio: selectedRatio.value,
                visualFitMode: document.querySelector('input[name="visual-fit-mode"]:checked')?.value || 'blur',
                fillFrame: document.querySelector('input[name="visual-fit-mode"]:checked')?.value !== 'fit'
            };

            console.log('Proje ayarları gönderiliyor:', projectSettings);
            ipcRenderer.send('slideshow-project-create', projectSettings);
            console.log('IPC gönderildi');
        });

        // İptal butonu
        cancelBtn.addEventListener('click', () => {
            ipcRenderer.send('slideshow-project-cancel');
            window.close();
        });

        // ESC ile kapat
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                ipcRenderer.send('slideshow-project-cancel');
                window.close();
            }
        });

        // Sayfa yüklendiğinde duyuru
        window.addEventListener('load', () => {
            initI18n();
            announce(t('runtime.new_project.opened', 'Create New Project window opened. Please choose a video output aspect ratio: 16:9 Landscape or 9:16 Portrait.'));
            // İlk radio'ya odaklan
            aspectRatioInputs[0].focus();
        });
    </script>
</body>

</html>
