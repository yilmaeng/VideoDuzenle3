<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVD 4.9 Download</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 3rem auto; padding: 0 1.25rem; line-height: 1.6; color: #17202a; background: #f7f4ec; }
    main { background: white; border: 1px solid #d6d0c4; border-radius: 1rem; padding: 2rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.5rem; }
    a { color: #075c54; }
    .button { display: inline-block; padding: .75rem 1rem; border-radius: .5rem; background: #075c54; color: white; text-decoration: none; font-weight: 700; }
    .secondary { background: #334155; }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <h1 id="title">EVD 4.9</h1>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="fallback"></p>
    <div class="actions">
      <a id="windows" class="button" href="/downloads/EVD-Setup-v4.9.0.exe"></a>
      <a id="mac" class="button secondary" href="/downloads/EVD-4.9.0-arm64.dmg"></a>
    </div>
  </main>
  <script>
    (() => {
      const messages = {
        tr: { status: 'İşletim sisteminize uygun EVD 4.9 indirmesi açılıyor.', fallback: 'Yönlendirme başlamazsa uygun indirme bağlantısını seçin.', windows: 'Windows kurulumunu indir', mac: 'Mac sürümünü indir (Apple Silicon)' },
        en: { status: 'The EVD 4.9 download for your operating system is opening.', fallback: 'If redirection does not start, choose the appropriate download link.', windows: 'Download Windows setup', mac: 'Download for Mac (Apple Silicon)' },
        de: { status: 'Der passende EVD-4.9-Download für Ihr Betriebssystem wird geöffnet.', fallback: 'Falls die Weiterleitung nicht startet, wählen Sie den passenden Download.', windows: 'Windows-Setup herunterladen', mac: 'Für Mac herunterladen (Apple Silicon)' },
        es: { status: 'Se abrirá la descarga de EVD 4.9 correspondiente a su sistema operativo.', fallback: 'Si la redirección no comienza, elija el enlace de descarga adecuado.', windows: 'Descargar instalador de Windows', mac: 'Descargar para Mac (Apple Silicon)' },
        fr: { status: 'Le téléchargement d’EVD 4.9 adapté à votre système va s’ouvrir.', fallback: 'Si la redirection ne démarre pas, choisissez le lien de téléchargement approprié.', windows: 'Télécharger la version Windows', mac: 'Télécharger pour Mac (Apple Silicon)' }
      };
      const lang = (navigator.language || 'en').toLowerCase().split('-')[0];
      const text = messages[lang] || messages.en;
      document.documentElement.lang = messages[lang] ? lang : 'en';
      document.getElementById('status').textContent = text.status;
      document.getElementById('fallback').textContent = text.fallback;
      document.getElementById('windows').textContent = text.windows;
      document.getElementById('mac').textContent = text.mac;
      const ua = navigator.userAgent || '';
      const platform = navigator.platform || '';
      const isMac = /Macintosh|Mac OS X/i.test(ua) || /Mac/i.test(platform);
      const isWindows = /Windows/i.test(ua) || /Win/i.test(platform);
      const target = isMac ? document.getElementById('mac').href : isWindows ? document.getElementById('windows').href : '';
      if (target) window.setTimeout(() => window.location.replace(target), 250);
    })();
  </script>
</body>
</html>
