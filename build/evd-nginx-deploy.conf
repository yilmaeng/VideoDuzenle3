server {
    server_name evd.drenginyilmaz.net;
    root /var/www/evd;
    index index.html index.htm;

    # Application data and source are private, even though the app is below web root.
    location = /evd-yayinodasi-server { return 404; }
    location ^~ /evd-yayinodasi-server/ { return 404; }

    location = /admin {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
    location = /admin/ { return 302 /admin; }

    # SigV4-authenticated private storage. Preserve path and Host for signatures.
    location = /evd-recordings {
        proxy_pass http://127.0.0.1:9198;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 1g;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        access_log off;
    }
    location ^~ /evd-recordings/ {
        proxy_pass http://127.0.0.1:9198;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 1g;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        access_log off;
    }

    access_log /var/log/nginx/evd.access.log;
    error_log /var/log/nginx/evd.error.log;

    # Güvenlik header'ları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(self), microphone=(self), speaker-selection=(self)" always;    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hidden dosyalara erişimi engelle (.env, .git, .htaccess vs)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Node.js — /api endpoint
    location ^~ /api {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Node.js — /yayinodasi endpoint
    location ^~ /yayinodasi {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Büyük dosya indirme (exe, zip, rar, 7z, iso, msi vs)
    location ~* \.(exe|zip|rar|7z|iso|msi|dmg|tar\.gz|tgz)$ {
        gzip off;
        add_header Content-Disposition 'attachment';
        add_header Cache-Control "public, no-transform";
        add_header Accept-Ranges bytes;
        expires 30d;
    }

    # Statik web varlıkları için cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Ana lokasyon
    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/evd.drenginyilmaz.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/evd.drenginyilmaz.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = evd.drenginyilmaz.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name evd.drenginyilmaz.net;
    return 404; # managed by Certbot
}
